# HoneyBadge Local Development Infrastructure
# Docker Compose — Phase 1 (HiClaw Mode, v1.1.0 split topology)
#
# Architecture:
#   Browser → Frontend (3000)        (static assets + audit API proxy)
#   Browser → honeybadge-auth (8091) (POST /login → Matrix token + roles JWT)
#   Browser → Tuwunel (7167)         (matrix-js-sdk direct connection)
#                                   HiClaw Embedded (infra bundle)
#                                     ├─ Tuwunel Matrix server (:6167 → host :7167)
#                                     ├─ MinIO (worker config storage)
#                                     ├─ Higress AI Gateway (:8080)
#                                     └─ Element Web chat UI (:18888)
#                                   HiClaw Manager (agent-only)
#                                     └─ Manager Agent (OpenClaw)
#                                          ↓ Worker dispatch via Matrix
#                                   HiClaw Workers → MCP Servers → NebulaGraph/Redis/PostgreSQL
#
# Quick start:
#   1. cd deploy/docker
#   2. docker compose up -d
#   3. Wait ~60s for HiClaw Embedded to start all internal services
#   4. Workers and Manager auto-init on startup (no manual step needed)
#      (init-workers.sh is kept as optional manual fallback/debugging tool)
#   5. Workers auto-start once their MinIO config exists (restart: unless-stopped)
#   6. Access: http://localhost:3000  |  Login: admin/admin123
#
# HiClaw UIs (after startup):
#   Element Web (Matrix agent chat): http://localhost:18888
#   MinIO Console (worker config):   http://localhost:19001  (admin/admin)
#   Higress Console (MCP tools):     http://localhost:18001
#
# Profiles:
#   --profile tools    nebula-console (interactive nGQL shell)
#   --profile vector   Milvus stack (Phase 2 semantic cache)
#
# Commands:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f hiclaw-embedded
#   docker compose logs -f hiclaw-manager
#   docker compose logs -f hiclaw-graph-worker
#   docker compose down          # stop, keep volumes
#   docker compose down -v       # stop + wipe all data (re-run init-workers.sh after)

services:
  # =============================================================================
  # NebulaGraph Cluster (1 metad + 1 storaged + 1 graphd) — pinned to v3.8.0
  # =============================================================================

  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: honeybadge-nebula-metad
    hostname: nebula-metad
    restart: unless-stopped
    ports:
      - "9559:9559"    # Meta RPC port
      - "9619:9619"    # Meta HTTP status port
    environment:
      - USER=root
      - TZ=Asia/Shanghai
    volumes:
      - ./data/metad:/data/meta
      - ./logs/metad:/logs
      - ./nebula-metad.conf:/usr/local/nebula/etc/nebula-metad.conf:ro
    command:
      - --flagfile=/usr/local/nebula/etc/nebula-metad.conf
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-metad:9619/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      com.honeybadge.service: "nebula-metad"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: honeybadge-nebula-storaged
    hostname: nebula-storaged
    restart: unless-stopped
    ports:
      - "9779:9779"      # Storage data port
      - "19779:19779"    # Storage HTTP status port
    environment:
      - USER=root
      - TZ=Asia/Shanghai
    volumes:
      - ./data/storaged:/data/storage
      - ./logs/storaged:/logs
      - ./nebula-storaged.conf:/usr/local/nebula/etc/nebula-storaged.conf:ro
    command:
      - --flagfile=/usr/local/nebula/etc/nebula-storaged.conf
    networks:
      - honeybadge-net
    depends_on:
      nebula-metad:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-storaged:19779/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      com.honeybadge.service: "nebula-storaged"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: honeybadge-nebula-graphd
    hostname: nebula-graphd
    restart: unless-stopped
    ports:
      - "9669:9669"      # Graph service port (main client connection)
      - "19669:19669"    # Graph HTTP status port
    environment:
      - USER=root
      - TZ=Asia/Shanghai
    volumes:
      - ./logs/graphd:/logs
      - ./nebula-graphd.conf:/usr/local/nebula/etc/nebula-graphd.conf:ro
    command:
      - --flagfile=/usr/local/nebula/etc/nebula-graphd.conf
    networks:
      - honeybadge-net
    depends_on:
      nebula-metad:
        condition: service_healthy
      nebula-storaged:
        condition: service_started    # storaged needs ADD HOSTS before it becomes healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-graphd:19669/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      com.honeybadge.service: "nebula-graphd"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # Interactive nGQL console — only with: docker compose --profile tools up -d
  nebula-console:
    image: vesoft/nebula-console:v3.8.0
    container_name: honeybadge-nebula-console
    hostname: nebula-console
    profiles:
      - tools
    networks:
      - honeybadge-net
    depends_on:
      nebula-graphd:
        condition: service_healthy
    entrypoint: ["nebula-console", "-addr", "nebula-graphd", "-port", "9669", "-user", "root", "-password", "nebula"]

  # =============================================================================
  # Redis Cache
  # =============================================================================

  redis:
    image: redis:7-alpine
    container_name: honeybadge-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis123
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.honeybadge.service: "redis"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # PostgreSQL (Audit Log + Sessions)
  # =============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: honeybadge-postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=honeybadge
      - POSTGRES_PASSWORD=honeybadge123
      - POSTGRES_DB=honeybadge_audit
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeybadge -d honeybadge_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.honeybadge.service: "postgres"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # HiClaw Embedded — infrastructure bundle (v1.1.0)
  #
  # Bundles: Tuwunel Matrix server (:6167 → host :7167), MinIO (:9000/:9001),
  #          Higress AI Gateway (:8080), Higress Console (:8001),
  #          Element Web (:18888)
  #
  # Network aliases aigw-local.hiclaw.io and matrix-local.hiclaw.io live here
  # so workers and other services resolve them to this container's IP.
  #
  # MATRIX_DOMAIN: sets Tuwunel server name → determines Matrix user ID format.
  #   User IDs: @username:matrix-local.hiclaw.io
  #   This must match MATRIX_USER_ID configured in honeybadge-server.
  #
  # Host port 7167 (not 6167) avoids Windows Hyper-V reserved range 6124-6223.
  # =============================================================================

  hiclaw-embedded:
    container_name: honeybadge-hiclaw-embedded
    hostname: hiclaw-embedded
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/hiclaw-embedded:v1.1.2
    restart: unless-stopped
    # NOTE (2026-05-08): the higress + pilot-discovery binaries inside this image
    # segfault on WSL2 kernel 6.6.x regardless of any container sandbox setting.
    # Other binaries (tuwunel, minio, hiclaw-controller, kube-apiserver) work
    # fine. Dev compose works around this with a separate `hiclaw-aigw-bypass`
    # nginx service (see below). Production k3s/ECS uses real Higress.
    environment:
      HICLAW_ADMIN_USER: ${HICLAW_ADMIN_USER:-admin}
      HICLAW_ADMIN_PASSWORD: ${HICLAW_ADMIN_PASSWORD:-admin1234}
      HICLAW_REGISTRATION_TOKEN: ${HICLAW_REGISTRATION_TOKEN:-honeybadge-reg-token}
      HICLAW_MATRIX_DOMAIN: ${HICLAW_MATRIX_DOMAIN:-matrix-local.hiclaw.io}
      HICLAW_GATEWAY_BIND: lan
      HICLAW_MATRIX_AUTOJOIN: always
      TZ: Asia/Shanghai
    ports:
      - "7167:6167"     # Tuwunel Matrix — host :7167 dodges Windows Hyper-V reserved range
      - "18888:18888"   # Element Web — Matrix chat UI for agent monitoring
      - "19001:9001"    # MinIO Console — inspect/manage worker config files
      - "18001:8001"    # Higress Admin Console — register/manage MCP tools
      - "18080:8080"    # Higress AI Gateway — external gateway access
    networks:
      honeybadge-net:
        aliases:
          # These hostnames are used by workers and other services to reach
          # infrastructure inside this container. Docker DNS resolves them to
          # hiclaw-embedded's current IP automatically — no hardcoded IPs.
          #
          # NOTE (2026-05-08): the `aigw-local.hiclaw.io` alias has been MOVED
          # to the `hiclaw-aigw-bypass` service (see below). Higress segfaults
          # on WSL2; production k3s/ECS still uses real Higress. This split is
          # documented in deploy/docker/README.md.
          - matrix-local.hiclaw.io      # Tuwunel Matrix server (port 6167)
    volumes:
      - hiclaw-embedded-data:/data    # Persists MinIO data + Tuwunel DB
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      com.honeybadge.service: "hiclaw-embedded"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # AI Gateway Bypass — DEV ONLY (WSL2 workaround)
  #
  # Higress + pilot-discovery (96M Go binaries from istio fork) segfault on
  # WSL2 kernel 6.6.x even under privileged: true + seccomp:unconfined +
  # apparmor:unconfined. Other binaries in hiclaw-embedded (kube-apiserver,
  # minio, hiclaw-controller, tuwunel) work fine, so the issue is binary-
  # specific (build flags vs. WSL2 kernel ABI).
  #
  # This nginx sidecar reverse-proxies /v1/* to the upstream LLM API, mirroring
  # what real Higress does (consumer/credential mapping → upstream auth).
  # Workers reach it via the `aigw-local.hiclaw.io` Docker network alias,
  # which has been moved here from `hiclaw-embedded`.
  #
  # Production k3s/ECS uses real Higress with real consumer/route/service-source
  # configuration. Higress integration is validated by `run-e2e-ecs.sh` on the
  # k3s gate. This bypass is NEVER deployed beyond local dev compose.
  #
  # See deploy/docker/README.md for the full WSL2 + Higress finding writeup.
  # =============================================================================

  hiclaw-aigw-bypass:
    container_name: honeybadge-hiclaw-aigw-bypass
    hostname: aigw-bypass
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY required for dev gateway bypass}
      LLM_UPSTREAM_HOST: ${LLM_UPSTREAM_HOST:-open.bigmodel.cn}
      LLM_UPSTREAM_PATH_PREFIX: ${LLM_UPSTREAM_PATH_PREFIX:-/api/paas/v4}
    volumes:
      - ../hiclaw/aigw-bypass.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      honeybadge-net:
        aliases:
          - aigw-local.hiclaw.io        # Workers' LLM gateway (was on hiclaw-embedded → broken Higress)
    ports:
      - "18082:8080"                    # Optional: host access for curl debugging
    healthcheck:
      # Use 127.0.0.1 explicitly — Alpine wget may resolve `localhost` to ::1
      # before IPv4, causing spurious "connection refused" health failures.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      com.honeybadge.service: "hiclaw-aigw-bypass"
      com.honeybadge.note: "WSL2 dev-only — Higress is bypassed; prod uses real Higress on k3s"

  # =============================================================================
  # HiClaw Manager — agent-only (v1.1.0)
  #
  # Runs the Manager Agent (OpenClaw) only. Infrastructure (Tuwunel, MinIO,
  # Higress, Element Web) has moved to the hiclaw-embedded service above.
  #
  # AUTO-INIT: entrypoint-wrapper.sh runs manager-init-internal.sh on every start.
  #   Manual fallback: bash deploy/hiclaw/init-workers.sh
  #
  # Healthcheck removed: manager no longer exposes MinIO or any other health
  # endpoint on localhost. Downstream services use service_started condition.
  # =============================================================================

  hiclaw-manager:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/hiclaw-manager:v1.1.2
    container_name: honeybadge-hiclaw-manager
    hostname: hiclaw-manager
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/honeybadge/init/entrypoint-wrapper.sh"]
    environment:
      # v1.1.0 slim manager image: drop supervisord; start-manager-agent.sh acts
      # as container entrypoint when HICLAW_RUNTIME=k8s|aliyun. We pick "k8s"
      # for Compose since both modes share the same container-entrypoint code path.
      # k8s mode also skips Matrix @manager registration and Higress setup —
      # those are normally done by the HiClaw Operator/ManagerReconciler. In
      # Compose we do them manually via entrypoint-wrapper.sh + manager-init-internal.sh.
      - HICLAW_RUNTIME=k8s
      # Admin credentials — used to connect to MinIO on hiclaw-embedded
      # MinIO requires password >= 8 chars; use .env to override
      - HICLAW_ADMIN_USER=${HICLAW_ADMIN_USER:-admin}
      - HICLAW_ADMIN_PASSWORD=${HICLAW_ADMIN_PASSWORD:-admin1234}
      # Tuwunel Matrix server name — must match domain in MATRIX_USER_ID below
      - HICLAW_MATRIX_DOMAIN=matrix-local.hiclaw.io
      # k8s mode: full URL to Tuwunel (Matrix server). Required with :? hard check.
      - HICLAW_MATRIX_URL=http://matrix-local.hiclaw.io:6167
      # Registration token — used by create-worker.sh to create Matrix accounts AND
      # by entrypoint-wrapper.sh to register @manager (k8s mode skips this in native script)
      - HICLAW_REGISTRATION_TOKEN=${HICLAW_REGISTRATION_TOKEN:-honeybadge-reg-token}
      # k8s mode: Matrix login password for @manager. Required with :? hard check.
      # Must be ≥8 chars. Pre-injected here; entrypoint-wrapper registers @manager
      # with this same password on first boot (idempotent).
      - HICLAW_MANAGER_PASSWORD=${HICLAW_MANAGER_PASSWORD:-hiclaw-manager-password-dev}
      # k8s mode: gateway key for openclaw.json + Higress consumer. Required with :?
      # Must be non-empty. manager-init-internal.sh registers this as the Higress
      # 'manager' consumer credential (key-auth Bearer).
      - HICLAW_MANAGER_GATEWAY_KEY=${HICLAW_MANAGER_GATEWAY_KEY:-hiclaw-manager-gw-key-dev-32chars}
      # Dev gateway mode: 'nginx-bypass' skips Higress route/consumer wiring
      # (used on WSL2 where Higress segfaults). 'higress' uses the embedded
      # Higress instance. Production k3s ALWAYS uses real Higress regardless.
      - HICLAW_DEV_GATEWAY=${HICLAW_DEV_GATEWAY:-higress}
      # LLM API key — used by HiClaw startup to configure the Higress AI Gateway route.
      # Without this, HiClaw skips auto-config (the route persists in the data volume,
      # but after "docker compose down -v" a fresh start would have no LLM route).
      - HICLAW_LLM_API_KEY=${LLM_API_KEY}
      # Use openai-compat provider instead of built-in qwen.
      # Built-in qwen type hardcodes dashscope.aliyuncs.com (standard API, no /v1 path).
      # openai-compat uses HICLAW_OPENAI_BASE_URL, allowing us to specify
      # coding.dashscope.aliyuncs.com (OpenAI-compatible endpoint at /v1/).
      # This is idempotent: setup-higress.sh does PUT on existing service sources.
      - HICLAW_LLM_PROVIDER=openai-compat
      - HICLAW_OPENAI_BASE_URL=https://coding.dashscope.aliyuncs.com/v1
      # AI Gateway template variables (v1.1.0 renames):
      #   HICLAW_AI_GATEWAY_SERVER (v1.0.8) → HICLAW_AI_GATEWAY_DOMAIN (template) +
      #   HICLAW_AI_GATEWAY_URL (k8s validation, full URL)
      - HICLAW_AI_GATEWAY_DOMAIN=aigw-local.hiclaw.io
      - HICLAW_AI_GATEWAY_URL=http://aigw-local.hiclaw.io:8080
      # k8s mode: mc alias setup uses these (same as hiclaw-embedded credentials)
      - HICLAW_FS_ENDPOINT=http://hiclaw-embedded:9000
      - HICLAW_FS_ACCESS_KEY=${HICLAW_ADMIN_USER:-admin}
      - HICLAW_FS_SECRET_KEY=${HICLAW_ADMIN_PASSWORD:-admin1234}
      # Default model for Manager Agent (Aliyun DashScope coding endpoint).
      # MANAGER_LLM_MODEL controls the Manager + Workers (must be tool-calling
      # capable — glm-5.2 or better).  LLM_MODEL controls MCP servers which
      # only do nGQL generation and can use the faster glm-4-flash.
      - HICLAW_DEFAULT_MODEL=${MANAGER_LLM_MODEL:-glm-5.2}
      # Disable memorySearch (LOAD-BEARING in v1.1.0).
      # hiclaw-env.sh uses `${HICLAW_EMBEDDING_MODEL-text-embedding-v4}` (single
      # dash), so unset falls back to the broken default — empty string is the
      # only way to opt out. coding.dashscope.aliyuncs.com does not expose an
      # OpenAI-compatible embedding endpoint at /v1/embeddings, so injecting
      # `text-embedding-v4` against the AI gateway aborts the Manager agent run
      # before any chat call. Empty string here keeps start-manager-agent.sh's
      # `if $emb_model != ""` branch from ever firing.
      - HICLAW_EMBEDDING_MODEL=
      # mcporter config path — fast-query.sh defaults to /root/config/mcporter.json
      # but the Manager workspace installs it at /root/manager-workspace/config/.
      # Without this, fast-query.sh fails with ENOENT and the Manager falls back
      # to the Worker route, which produces trace_id="N/A" (LLM doesn't propagate
      # the MCP-generated trace_id, breaking TC-102/TC-107 trace assertions).
      - MCPORTER_CONFIG=/root/manager-workspace/config/mcporter.json
      - TZ=Asia/Shanghai
    volumes:
      - ../hiclaw/entrypoint-wrapper.sh:/opt/honeybadge/init/entrypoint-wrapper.sh:ro
      - ../hiclaw/manager-init-internal.sh:/opt/honeybadge/init/manager-init-internal.sh:ro
      - ../../hiclaw:/opt/honeybadge/config:ro   # HoneyBadge agent configs (SOUL.md, AGENTS.md, skills)
      - hiclaw-manager-data:/data                # v1.1.0 native manager-agent state (workers-registry.json, openclaw.json, dataset cache)
    networks:
      - honeybadge-net
    depends_on:
      hiclaw-embedded:
        condition: service_healthy
    labels:
      com.honeybadge.service: "hiclaw-manager"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # HiClaw Workers — lightweight stateless agent containers
  #
  # Each Worker pulls its config from MinIO at startup:
  #   hiclaw-storage/agents/{WORKER_NAME}/SOUL.md
  #   hiclaw-storage/agents/{WORKER_NAME}/AGENTS.md
  #   hiclaw-storage/agents/{WORKER_NAME}/openclaw.json
  #
  # Workers auto-init on startup via worker-init-wrapper.sh (MCP registration).
  # Manager auto-init populates MinIO configs via entrypoint-wrapper.sh.
  # =============================================================================

  hiclaw-graph-worker:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/hiclaw-worker:v1.1.2
    container_name: honeybadge-graph-worker
    hostname: hiclaw-graph-worker
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/honeybadge/init/worker-init-wrapper.sh"]
    environment:
      - HICLAW_WORKER_NAME=graph-worker
      - HICLAW_FS_ENDPOINT=http://hiclaw-embedded:9000
      - HICLAW_FS_ACCESS_KEY=${HICLAW_ADMIN_USER:-admin}
      - HICLAW_FS_SECRET_KEY=${HICLAW_ADMIN_PASSWORD:-admin1234}
      - TZ=Asia/Shanghai
    volumes:
      - ../hiclaw/worker-init-wrapper.sh:/opt/honeybadge/init/worker-init-wrapper.sh:ro
    networks:
      - honeybadge-net
    depends_on:
      hiclaw-embedded:
        condition: service_healthy
      hiclaw-manager:
        condition: service_started
    labels:
      com.honeybadge.service: "hiclaw-graph-worker"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  hiclaw-analytics-worker:
    image: honeybadge/hiclaw-hermes-worker:v1.1.2-1
    build:
      context: ../hiclaw
      dockerfile: Dockerfile.hermes-worker
    pull_policy: never
    container_name: honeybadge-analytics-worker
    hostname: hiclaw-analytics-worker
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/honeybadge/init/worker-init-wrapper.sh"]
    environment:
      - HICLAW_WORKER_NAME=analytics-worker
      - HICLAW_WORKER_RUNTIME=hermes
      - HICLAW_FS_ENDPOINT=http://hiclaw-embedded:9000
      - HICLAW_FS_ACCESS_KEY=${HICLAW_ADMIN_USER:-admin}
      - HICLAW_FS_SECRET_KEY=${HICLAW_ADMIN_PASSWORD:-admin1234}
      - TZ=Asia/Shanghai
    volumes:
      - ../hiclaw/worker-init-wrapper.sh:/opt/honeybadge/init/worker-init-wrapper.sh:ro
    networks:
      - honeybadge-net
    depends_on:
      hiclaw-embedded:
        condition: service_healthy
      hiclaw-manager:
        condition: service_started
    labels:
      com.honeybadge.service: "hiclaw-analytics-worker"
      com.honeybadge.runtime: "hermes"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # MCP Servers — tools exposed to HiClaw Workers via Higress AI Gateway
  #
  # Build context: project root (../../ from deploy/docker/)
  # After init-workers.sh: run deploy/hiclaw/setup-honeybadge-mcps.sh
  #   to register these servers in Higress so Workers can call them.
  # =============================================================================

  honeybadge-nebula-mcp:
    build:
      context: ../..
      dockerfile: mcp-servers/honeybadge-nebula-mcp/Dockerfile
    container_name: honeybadge-nebula-mcp
    hostname: honeybadge-nebula-mcp
    restart: unless-stopped
    environment:
      - NEBULA_HOST=nebula-graphd
      - NEBULA_PORT=9669
      - NEBULA_USER=${NEBULA_USER:-root}
      - NEBULA_PASSWORD=${NEBULA_PASSWORD:-nebula}
      - NEBULA_SPACE=${NEBULA_SPACE:-honeybadge}
      - LLM_ENDPOINT=${MCP_LLM_ENDPOINT:-http://aigw-local.hiclaw.io:8080}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - PERMISSION_SERVICE_URL=http://honeybadge-permissions:8092
      - TZ=Asia/Shanghai
    networks:
      - honeybadge-net
    depends_on:
      nebula-graphd:
        condition: service_healthy
      honeybadge-permissions:
        condition: service_healthy
    labels:
      com.honeybadge.service: "honeybadge-nebula-mcp"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  honeybadge-audit-mcp:
    build:
      context: ../..
      dockerfile: mcp-servers/honeybadge-audit-mcp/Dockerfile
    container_name: honeybadge-audit-mcp
    hostname: honeybadge-audit-mcp
    restart: unless-stopped
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-honeybadge}
      - PG_PASSWORD=${PG_PASSWORD:-honeybadge123}
      - PG_DATABASE=${PG_DB:-honeybadge_audit}
      - TZ=Asia/Shanghai
    networks:
      - honeybadge-net
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      com.honeybadge.service: "honeybadge-audit-mcp"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  honeybadge-cache-mcp:
    build:
      context: ../..
      dockerfile: mcp-servers/honeybadge-cache-mcp/Dockerfile
    container_name: honeybadge-cache-mcp
    hostname: honeybadge-cache-mcp
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - TZ=Asia/Shanghai
    networks:
      - honeybadge-net
    depends_on:
      redis:
        condition: service_healthy
    labels:
      com.honeybadge.service: "honeybadge-cache-mcp"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # HoneyBadge Backend Server
  # Serves audit API and static assets. Auth is handled by honeybadge-auth.
  # =============================================================================

  honeybadge-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    container_name: honeybadge-server
    hostname: honeybadge-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # NebulaGraph
      - NEBULA_HOST=nebula-graphd
      - NEBULA_PORT=9669
      - NEBULA_USER=${NEBULA_USER:-root}
      - NEBULA_PASSWORD=${NEBULA_PASSWORD:-nebula}
      - NEBULA_SPACE=${NEBULA_SPACE:-honeybadge}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      # PostgreSQL
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-honeybadge}
      - PG_PASSWORD=${PG_PASSWORD:-honeybadge123}
      - PG_DATABASE=${PG_DB:-honeybadge_audit}
      # LLM
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://host.docker.internal:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      # Auth
      - JWT_SECRET=${JWT_SECRET:-honeybadge-dev-secret-change-in-prod}
      - SERVER_PORT=8090
      - TZ=Asia/Shanghai
    depends_on:
      nebula-graphd:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hiclaw-embedded:
        condition: service_healthy
      hiclaw-manager:
        condition: service_started
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.honeybadge.service: "honeybadge-server"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # HoneyBadge Auth Service (Approach B)
  # Provisions per-user Matrix accounts in Tuwunel at login time.
  # Browser calls POST /login → gets matrix_access_token + roles_jwt
  # =============================================================================

  honeybadge-auth:
    build:
      context: ../..
      dockerfile: src/honeybadge/auth_service/Dockerfile
    container_name: honeybadge-auth
    hostname: honeybadge-auth
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      - TUWUNEL_URL=http://matrix-local.hiclaw.io:6167
      - MATRIX_DOMAIN=matrix-local.hiclaw.io
      - HICLAW_REGISTRATION_TOKEN=${HICLAW_REGISTRATION_TOKEN:-honeybadge-reg-token}
      - MATRIX_USER_SECRET=${MATRIX_USER_SECRET:-hb-user-secret-dev}
      - JWT_SECRET=${JWT_SECRET:-honeybadge-dev-secret-change-in-prod}
      - MATRIX_HOMESERVER_PUBLIC=http://localhost:7167
      # Manager password — used to log in as @manager and populate the
      # Manager's m.direct account data after DM room creation.  Without
      # this, OpenClaw classifies new rooms as "channel" (mention-gated)
      # and silently ignores user queries.
      - MANAGER_MATRIX_PASSWORD=${HICLAW_MANAGER_PASSWORD:-hiclaw-manager-password-dev}
      - TZ=Asia/Shanghai
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_ENABLED=${GOOGLE_ENABLED:-false}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://localhost:8091}
      - DEFAULT_ROLE=${DEFAULT_ROLE:-analyst}
    depends_on:
      hiclaw-embedded:
        condition: service_healthy
      hiclaw-manager:
        condition: service_started
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8091), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.honeybadge.service: "honeybadge-auth"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # HoneyBadge Permission Service
  # Returns PermissionContext per user for L3 enforcement.
  # Internal URL: http://honeybadge-permissions:8092
  # =============================================================================

  honeybadge-permissions:
    build:
      context: ../..
      dockerfile: src/honeybadge/permission_service/Dockerfile
    container_name: honeybadge-permissions
    hostname: honeybadge-permissions
    restart: unless-stopped
    ports:
      - "8092:8092"
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8092),2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      com.honeybadge.service: "honeybadge-permissions"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # Frontend — Vue 3 + Vite dev server
  # Proxies /api → honeybadge-server:8090 and /ws → ws://honeybadge-server:8090
  # Access: http://localhost:3000
  # Login: admin/admin123, analyst/analyst123, auditor/auditor123
  # =============================================================================

  frontend:
    image: node:20-alpine
    container_name: honeybadge-frontend
    hostname: frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://honeybadge-server:8090
      - VITE_WS_TARGET=ws://honeybadge-server:8090
      - VITE_AUTH_URL=http://localhost:8091
      - VITE_MATRIX_HOMESERVER=http://localhost:7167
      - TZ=Asia/Shanghai
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - honeybadge-net
    depends_on:
      honeybadge-server:
        condition: service_started
      honeybadge-auth:
        condition: service_started
    labels:
      com.honeybadge.service: "frontend"
      com.honeybadge.version: "${IMAGE_TAG:-latest}"

  # =============================================================================
  # Milvus Vector DB — Phase 2 semantic cache (optional)
  # Start with: docker compose --profile vector up -d
  # =============================================================================

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: honeybadge-milvus-etcd
    hostname: milvus-etcd
    profiles:
      - vector
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - TZ=Asia/Shanghai
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - honeybadge-net

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: honeybadge-milvus-minio
    hostname: milvus-minio
    profiles:
      - vector
    restart: unless-stopped
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - TZ=Asia/Shanghai
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: honeybadge-milvus
    hostname: milvus
    profiles:
      - vector
    restart: unless-stopped
    ports:
      - "19530:19530"    # Milvus gRPC
      - "9091:9091"      # Milvus HTTP
    environment:
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
      - TZ=Asia/Shanghai
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - honeybadge-net

  # =============================================================================
  # Observability Stack (Phase 1.5) — enabled with --profile observability
  # Prometheus + Grafana + Loki + Promtail + Alertmanager
  # =============================================================================

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: honeybadge-prometheus
    hostname: prometheus
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.1.0
    container_name: honeybadge-grafana
    hostname: grafana
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Asia/Shanghai
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - honeybadge-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:2.9.0
    container_name: honeybadge-loki
    hostname: loki
    restart: unless-stopped
    profiles:
      - observability
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:2.9.0
    container_name: honeybadge-promtail
    hostname: promtail
    restart: unless-stopped
    profiles:
      - observability
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ../observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    networks:
      - honeybadge-net
    depends_on:
      - loki

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: honeybadge-alertmanager
    hostname: alertmanager
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yaml'
      - '--storage.path=/alertmanager'
    volumes:
      - ../observability/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# Networks & Volumes
# =============================================================================

networks:
  honeybadge-net:
    driver: bridge
    name: honeybadge-network

volumes:
  redis_data:
    name: honeybadge-redis-data

  postgres_data:
    name: honeybadge-postgres-data

  hiclaw-embedded-data:
    name: honeybadge-hiclaw-embedded-data   # Persists MinIO data + Tuwunel DB (infra bundle)

  hiclaw-manager-data:
    name: honeybadge-hiclaw-manager-data    # v1.1.0 manager-agent /data: workers-registry.json + openclaw.json runtime state

  frontend_node_modules:
    name: honeybadge-frontend-node-modules

  # Milvus (Phase 2 — --profile vector)
  milvus_etcd_data:
    name: honeybadge-milvus-etcd-data
  milvus_minio_data:
    name: honeybadge-milvus-minio-data
  milvus_data:
    name: honeybadge-milvus-data

  # Observability (Phase 1.5 — --profile observability)
  prometheus_data:
    name: honeybadge-prometheus-data
  grafana_data:
    name: honeybadge-grafana-data
  loki_data:
    name: honeybadge-loki-data
  promtail_positions:
    name: honeybadge-promtail-positions
  alertmanager_data:
    name: honeybadge-alertmanager-data
