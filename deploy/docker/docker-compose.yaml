# HoneyBadge Local Development Infrastructure
# Docker Compose for Docker Desktop + WSL
#
# Services:
#   - nebula-graphd: NebulaGraph Graph Service (port 9669)
#   - nebula-storaged: NebulaGraph Storage Service
#   - nebula-metad: NebulaGraph Metadata Service
#   - redis: Redis for session/cache (port 6379)
#   - postgres: PostgreSQL for audit log (port 5432)
#   - matrix: Matrix homeserver for HiClaw (port 8008)
#   - higress: AI Gateway with SSO/rate-limiting (port 80/443) [NEW]
#
# Architecture:
#   Frontend → Higress (port 80) → HoneyBadge Server (port 8090)
#                                    ↓
#                              HiClaw Manager ← Matrix ← Workers
#
# Usage:
#   docker-compose up -d
#   docker-compose ps
#   docker-compose logs -f [service]
#   docker-compose down (stop)
#   docker-compose down -v (stop + remove volumes)

services:
  # =============================================================================
  # NebulaGraph Cluster (1 metad + 1 storaged + 1 graphd)
  # =============================================================================

  nebula-metad:
    image: vesoft/nebula-metad:nightly
    container_name: honeybadge-nebula-metad
    hostname: nebula-metad
    restart: unless-stopped
    ports:
      - "9559:9559"  # Meta service port
      - "9619:9619"  # Meta HTTP port
    environment:
      - USER=root
      - TZ=Asia/Shanghai
    volumes:
      - ./data/metad:/data/meta
      - ./logs/metad:/logs
      - ./nebula-metad.conf:/usr/local/nebula/etc/nebula-metad.conf:ro
    command:
      - --flagfile=/usr/local/nebula/etc/nebula-metad.conf
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-metad:9619/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nebula-storaged:
    image: vesoft/nebula-storaged:nightly
    container_name: honeybadge-nebula-storaged
    hostname: nebula-storaged
    restart: unless-stopped
    ports:
      - "9779:9779"    # Storage data port
      - "19779:19779"  # Storage HTTP status port
    environment:
      - USER=root
      - TZ=Asia/Shanghai
    volumes:
      - ./data/storaged:/data/storage
      - ./logs/storaged:/logs
      - ./nebula-storaged.conf:/usr/local/nebula/etc/nebula-storaged.conf:ro
    command:
      - --flagfile=/usr/local/nebula/etc/nebula-storaged.conf
    depends_on:
      nebula-metad:
        condition: service_started
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-storaged:19779/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nebula-graphd:
    image: vesoft/nebula-graphd:nightly
    container_name: honeybadge-nebula-graphd
    hostname: nebula-graphd
    restart: unless-stopped
    ports:
      - "9669:9669"  # Graph service port (main)
      - "19669:19669"  # Graph HTTP port
    environment:
      - USER=root
      - TZ=Asia/Shanghai
    volumes:
      - ./logs/graphd:/logs
      - ./nebula-graphd.conf:/usr/local/nebula/etc/nebula-graphd.conf:ro
    command:
      - --flagfile=/usr/local/nebula/etc/nebula-graphd.conf
    depends_on:
      nebula-metad:
        condition: service_started
      nebula-storaged:
        condition: service_started
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-graphd:19669/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # =============================================================================
  # NebulaGraph Console (for running .ngql scripts)
  # =============================================================================

  nebula-console:
    image: vesoft/nebula-console:nightly
    container_name: honeybadge-nebula-console
    hostname: nebula-console
    profiles:
      - tools  # Only runs with: docker-compose --profile tools up
    networks:
      - honeybadge-net
    depends_on:
      nebula-graphd:
        condition: service_healthy
    entrypoint: ["nebula-console", "-addr", "nebula-graphd", "-port", "9669", "-user", "root", "-password", "nebula"]

  # =============================================================================
  # Redis Cache
  # =============================================================================

  redis:
    image: redis:7-alpine
    container_name: honeybadge-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # Redis port
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis123
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # PostgreSQL (Audit Log)
  # =============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: honeybadge-postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"  # PostgreSQL port
    environment:
      - POSTGRES_USER=honeybadge
      - POSTGRES_PASSWORD=honeybadge123
      - POSTGRES_DB=honeybadge_audit
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeybadge -d honeybadge_audit"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # Matrix Homeserver (for HiClaw Manager-Worker Communication)
  # =============================================================================

  matrix-conduit:
    image: matrixconduit/matrix-conduit:latest
    container_name: honeybadge-matrix
    hostname: matrix
    restart: unless-stopped
    ports:
      - "8008:8008"  # Client API
      - "8448:8448"  # Federation
    environment:
      - RUST_LOG=info
      - CONDUIT_CONFIG=/data/conduit.toml
      - TZ=Asia/Shanghai
    volumes:
      - ./matrix-data:/data
      - ./conduit.toml:/data/conduit.toml:ro
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Milvus (Vector DB for Phase 2 - Semantic Cache & Ontology)
  # =============================================================================

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: honeybadge-milvus-etcd
    hostname: milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - TZ=Asia/Shanghai
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - honeybadge-net

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: honeybadge-milvus-minio
    hostname: milvus-minio
    restart: unless-stopped
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - TZ=Asia/Shanghai
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: honeybadge-milvus
    hostname: milvus
    restart: unless-stopped
    ports:
      - "19530:19530"  # Milvus gRPC port
      - "9091:9091"    # Milvus HTTP port
    environment:
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
      - TZ=Asia/Shanghai
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # =============================================================================
  # HoneyBadge MCP Servers
  # =============================================================================

  honeybadge-nebula-mcp:
    build:
      context: ../..
      dockerfile: mcp-servers/honeybadge-nebula-mcp/Dockerfile
    container_name: honeybadge-nebula-mcp
    hostname: honeybadge-nebula-mcp
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - NEBULA_HOST=nebula-graphd
      - NEBULA_PORT=9669
      - NEBULA_USER=root
      - NEBULA_PASSWORD=nebula
      - NEBULA_SPACE=honeybadge
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://host.docker.internal:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - TZ=Asia/Shanghai
    depends_on:
      nebula-graphd:
        condition: service_healthy
    networks:
      - honeybadge-net

  honeybadge-audit-mcp:
    build:
      context: ../..
      dockerfile: mcp-servers/honeybadge-audit-mcp/Dockerfile
    container_name: honeybadge-audit-mcp
    hostname: honeybadge-audit-mcp
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=honeybadge
      - POSTGRES_PASSWORD=honeybadge123
      - POSTGRES_DB=honeybadge_audit
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - honeybadge-net

  honeybadge-cache-mcp:
    build:
      context: ../..
      dockerfile: mcp-servers/honeybadge-cache-mcp/Dockerfile
    container_name: honeybadge-cache-mcp
    hostname: honeybadge-cache-mcp
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - TZ=Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - honeybadge-net

  # =============================================================================
  # Higress Gateway (AI Gateway - SSO/OAuth2, rate limiting, auth)
  # =============================================================================

  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/server:latest
    container_name: honeybadge-higress
    hostname: higress
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (for WebSocket upgrade)
      - "443:443"    # HTTPS (future)
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./higress.conf:/etc/higress/higress.conf:ro
      - ./gateway/config/routes.yaml:/etc/higress/routes/routes.yaml:ro
      - ./gateway/config/auth.yaml:/etc/higress/plugins/auth.yaml:ro
      - ./gateway/config/cors.yaml:/etc/higress/plugins/cors.yaml:ro
      - ./gateway/config/rate-limit.yaml:/etc/higress/plugins/rate-limit.yaml:ro
      - ./gateway/config/header-transform.yaml:/etc/higress/plugins/header-transform.yaml:ro
      - higress_data:/etc/higress/data
    networks:
      honeybadge-net:
        aliases:
          - higress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # HoneyBadge Backend Server
  # =============================================================================

  honeybadge-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    container_name: honeybadge-server
    hostname: honeybadge-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - NEBULA_HOST=nebula-graphd
      - NEBULA_PORT=9669
      - NEBULA_USER=root
      - NEBULA_PASSWORD=nebula
      - NEBULA_SPACE=honeybadge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=honeybadge
      - PG_PASSWORD=honeybadge123
      - PG_DATABASE=honeybadge_audit
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://host.docker.internal:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - JWT_SECRET=${JWT_SECRET:-honeybadge-dev-secret-change-in-prod}
      - ORCHESTRATOR_TYPE=direct
      - SERVER_PORT=8090
      # Matrix gateway bot credentials (connects to HiClaw Manager)
      - MATRIX_HOMESERVER_URL=http://matrix:8008
      - MATRIX_USER_ID=@honeybadge-gateway:matrix.local
      - MATRIX_USER_PASSWORD=${MATRIX_GATEWAY_PASSWORD:-gateway-dev-pass}
      - TZ=Asia/Shanghai
    depends_on:
      nebula-graphd:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      matrix-conduit:
        condition: service_healthy
    networks:
      - honeybadge-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # HiClaw Manager — routes queries from gateway to workers
  # =============================================================================

  hiclaw-manager:
    build:
      context: ../..
      dockerfile: deploy/hiclaw/Dockerfile.manager
    container_name: honeybadge-hiclaw-manager
    hostname: hiclaw-manager
    restart: unless-stopped
    environment:
      - MATRIX_HOMESERVER_URL=http://matrix:8008
      - MATRIX_USER_ID=@honeybadge-manager:matrix.local
      - MATRIX_USER_PASSWORD=${MATRIX_MANAGER_PASSWORD:-manager-dev-pass}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://host.docker.internal:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - NEBULA_MCP_URL=http://honeybadge-nebula-mcp:8000
      - AUDIT_MCP_URL=http://honeybadge-audit-mcp:8000
      - CACHE_MCP_URL=http://honeybadge-cache-mcp:8000
      - TZ=Asia/Shanghai
    depends_on:
      matrix-conduit:
        condition: service_healthy
      honeybadge-nebula-mcp:
        condition: service_started
      honeybadge-audit-mcp:
        condition: service_started
      honeybadge-cache-mcp:
        condition: service_started
    networks:
      - honeybadge-net

  # =============================================================================
  # HiClaw Workers — execute queries via MCP tools
  # =============================================================================

  hiclaw-graph-worker:
    build:
      context: ../..
      dockerfile: deploy/hiclaw/Dockerfile.worker
    container_name: honeybadge-graph-worker
    hostname: hiclaw-graph-worker
    restart: unless-stopped
    environment:
      - WORKER_TYPE=graph-worker
      - MATRIX_HOMESERVER_URL=http://matrix:8008
      - MATRIX_USER_ID=@graph-worker:matrix.local
      - MATRIX_USER_PASSWORD=${MATRIX_GRAPH_WORKER_PASSWORD:-graph-worker-dev-pass}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://host.docker.internal:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - NEBULA_MCP_URL=http://honeybadge-nebula-mcp:8000
      - AUDIT_MCP_URL=http://honeybadge-audit-mcp:8000
      - CACHE_MCP_URL=http://honeybadge-cache-mcp:8000
      - TZ=Asia/Shanghai
    depends_on:
      hiclaw-manager:
        condition: service_started
    networks:
      - honeybadge-net

  hiclaw-analytics-worker:
    build:
      context: ../..
      dockerfile: deploy/hiclaw/Dockerfile.worker
    container_name: honeybadge-analytics-worker
    hostname: hiclaw-analytics-worker
    restart: unless-stopped
    environment:
      - WORKER_TYPE=analytics-worker
      - MATRIX_HOMESERVER_URL=http://matrix:8008
      - MATRIX_USER_ID=@analytics-worker:matrix.local
      - MATRIX_USER_PASSWORD=${MATRIX_ANALYTICS_WORKER_PASSWORD:-analytics-worker-dev-pass}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://host.docker.internal:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - NEBULA_MCP_URL=http://honeybadge-nebula-mcp:8000
      - AUDIT_MCP_URL=http://honeybadge-audit-mcp:8000
      - CACHE_MCP_URL=http://honeybadge-cache-mcp:8000
      - TZ=Asia/Shanghai
    depends_on:
      hiclaw-manager:
        condition: service_started
    networks:
      - honeybadge-net

# =============================================================================
# Networks & Volumes
# =============================================================================

networks:
  honeybadge-net:
    driver: bridge
    name: honeybadge-network

volumes:
  # NebulaGraph
  nebula_metad_data:
    name: honeybadge-nebula-metad-data
  nebula_metad_logs:
    name: honeybadge-nebula-metad-logs
  nebula_storaged_data:
    name: honeybadge-nebula-storaged-data
  nebula_storaged_logs:
    name: honeybadge-nebula-storaged-logs
  nebula_graphd_logs:
    name: honeybadge-nebula-graphd-logs

  # Redis
  redis_data:
    name: honeybadge-redis-data

  # PostgreSQL
  postgres_data:
    name: honeybadge-postgres-data

  # Matrix
  matrix_data:
    name: honeybadge-matrix-data

  # Milvus
  milvus_etcd_data:
    name: honeybadge-milvus-etcd-data
    driver: local
  milvus_minio_data:
    name: honeybadge-milvus-minio-data
    driver: local
  milvus_data:
    name: honeybadge-milvus-data

  # Higress
  higress_data:
    name: honeybadge-higress-data
