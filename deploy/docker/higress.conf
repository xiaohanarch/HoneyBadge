# Higress Standalone Configuration for HoneyBadge
# For Docker Compose deployment

global:
  logLevel: info

# Ingress controller
ingress:
  enableNativeKubernetesCRDs: true

# HTTP/WS server (Higress's built-in proxy)
httpAddr: 0.0.0.0:80
httpsAddr: 0.0.0.0:443

# Enable WebSocket
enableWebSocket: true

# Registry - file-based for Docker Compose
registry:
  type: file
  file:
    refreshInterval: 30s
