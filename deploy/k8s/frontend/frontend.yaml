apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: honeybadge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: honeybadge
    spec:
      containers:
        - name: frontend
          image: honeybadge-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: TZ
              value: "Asia/Shanghai"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: honeybadge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 80
      targetPort: 3000
---
# Ingress — k3s Traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: honeybadge-ingress
  namespace: honeybadge
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: honeybadge-server
                port:
                  number: 8090
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: honeybadge-auth
                port:
                  number: 8091
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: honeybadge-auth
                port:
                  number: 8091
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
