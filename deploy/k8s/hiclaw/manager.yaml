# =============================================================================
# HiClaw Manager — All-in-one supervisord container
# Contains: Tuwunel Matrix, MinIO, Higress Gateway, Element Web, Manager Agent
#
# DNS aliases: aigw-local.hiclaw.io and matrix-local.hiclaw.io are Docker
# network aliases. In K8s, use the service names below or add CoreDNS rewrites:
#   rewrite name aigw-local.hiclaw.io aigw-local-hiclaw-io.honeybadge.svc.cluster.local
#   rewrite name matrix-local.hiclaw.io matrix-local-hiclaw-io.honeybadge.svc.cluster.local
# =============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hiclaw-manager-data
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: hiclaw-manager
    app.kubernetes.io/part-of: honeybadge
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiclaw-manager
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: hiclaw-manager
    app.kubernetes.io/part-of: honeybadge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hiclaw-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hiclaw-manager
        app.kubernetes.io/part-of: honeybadge
    spec:
      # ---------------------------------------------------------------------
      # Layer 1 of the CRLF defense-in-depth strategy.
      # ConfigMap volume mounts are read-only, so we can't `sed -i` them in
      # place.  Instead:
      #   1. Mount the raw ConfigMaps at /src/* in this initContainer.
      #   2. Copy each file to an emptyDir volume, stripping CR bytes.
      #   3. Main container mounts the emptyDir where the skills are expected.
      # Guarantees that even if a developer commits a CRLF-tainted script
      # (Layers 2+3 should prevent this), the runtime sees clean LF files.
      # ---------------------------------------------------------------------
      initContainers:
        - name: normalize-skill-scripts
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              normalize() {
                  local src="$1" dst="$2"
                  mkdir -p "$dst"
                  for f in "$src"/*; do
                      [ -f "$f" ] || continue
                      local name="$(basename "$f")"
                      # Strip CR, preserve permissions via chmod
                      sed 's/\r$//' "$f" > "$dst/$name"
                      chmod 0755 "$dst/$name"
                  done
                  echo "normalized $src -> $dst ($(ls -1 "$dst" | wc -l) files)"
              }
              normalize /src/fast-query     /dst/fast-query
              normalize /src/erp-dispatch   /dst/erp-dispatch
              echo "CRLF normalization complete."
          volumeMounts:
            - name: fast-query-skill-raw
              mountPath: /src/fast-query
              readOnly: true
            - name: erp-dispatch-scripts-raw
              mountPath: /src/erp-dispatch
              readOnly: true
            - name: normalized-scripts
              mountPath: /dst
      containers:
        - name: hiclaw-manager
          image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/hiclaw-manager:v1.0.9
          command: ["/bin/bash", "/opt/honeybadge/init/entrypoint-wrapper.sh"]
          env:
            - name: HICLAW_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: HICLAW_ADMIN_USER
            - name: HICLAW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: HICLAW_ADMIN_PASSWORD
            - name: HICLAW_MATRIX_DOMAIN
              value: "matrix-local.hiclaw.io"
            - name: HICLAW_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: HICLAW_REGISTRATION_TOKEN
            - name: HICLAW_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: LLM_API_KEY
            - name: HICLAW_LLM_PROVIDER
              value: "openai-compat"
            - name: HICLAW_OPENAI_BASE_URL
              value: "https://api.minimaxi.com/v1"
            - name: HICLAW_AI_GATEWAY_SERVER
              value: "aigw-local.hiclaw.io"
            - name: HICLAW_DEFAULT_MODEL
              value: "MiniMax-M2.7-highspeed"
            - name: TZ
              value: "Asia/Shanghai"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=3072"
          ports:
            - containerPort: 6167
              name: matrix
            - containerPort: 8080
              name: gateway
            - containerPort: 9000
              name: minio
            - containerPort: 9001
              name: minio-console
            - containerPort: 8001
              name: higress-console
            - containerPort: 18888
              name: element
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: init-scripts
              mountPath: /opt/honeybadge/init/entrypoint-wrapper.sh
              subPath: entrypoint-wrapper.sh
              readOnly: true
            - name: init-scripts
              mountPath: /opt/honeybadge/init/manager-init-internal.sh
              subPath: manager-init-internal.sh
              readOnly: true
            - name: agent-configs
              mountPath: /opt/honeybadge/config/workers/graph-worker/agent/SOUL.md
              subPath: graph-worker-soul
              readOnly: true
            - name: agent-configs
              mountPath: /opt/honeybadge/config/workers/analytics-worker/agent/SOUL.md
              subPath: analytics-worker-soul
              readOnly: true
            - name: agent-configs
              mountPath: /opt/honeybadge/config/manager/agent/SOUL.md
              subPath: manager-soul
              readOnly: true
            - name: agent-configs
              mountPath: /opt/honeybadge/config/manager/agent/AGENTS.md
              subPath: manager-agents
              readOnly: true
            - name: agent-configs
              mountPath: /opt/honeybadge/config/manager/agent/HEARTBEAT.md
              subPath: manager-heartbeat
              readOnly: true
            # CRLF-normalized skill scripts (produced by initContainer).
            - name: normalized-scripts
              mountPath: /opt/honeybadge/config/manager/agent/skills/fast-query
              subPath: fast-query
              readOnly: true
            - name: normalized-scripts
              mountPath: /opt/honeybadge/config/manager/agent/skills/erp-query-dispatch/scripts
              subPath: erp-dispatch
              readOnly: true
            - name: mcporter-config
              mountPath: /root/config/mcporter.json
              subPath: mcporter.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hiclaw-manager-data
        - name: init-scripts
          configMap:
            name: hiclaw-init-scripts
            defaultMode: 0755
        - name: agent-configs
          configMap:
            name: hiclaw-agent-configs
        # Raw ConfigMaps consumed by the initContainer only.
        - name: fast-query-skill-raw
          configMap:
            name: hiclaw-fast-query-skill
        - name: erp-dispatch-scripts-raw
          configMap:
            name: hiclaw-erp-dispatch-scripts
        # Writable scratch space for the CRLF-normalized skill scripts.
        - name: normalized-scripts
          emptyDir: {}
        - name: mcporter-config
          configMap:
            name: hiclaw-mcporter-config
---
# Main service — all ports
apiVersion: v1
kind: Service
metadata:
  name: hiclaw-manager
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: hiclaw-manager
    app.kubernetes.io/part-of: honeybadge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hiclaw-manager
  ports:
    - name: matrix
      port: 6167
      targetPort: 6167
    - name: gateway
      port: 8080
      targetPort: 8080
    - name: minio
      port: 9000
      targetPort: 9000
    - name: minio-console
      port: 9001
      targetPort: 9001
    - name: higress-console
      port: 8001
      targetPort: 8001
    - name: element
      port: 18888
      targetPort: 18888
---
# DNS alias: aigw-local.hiclaw.io → hiclaw-manager:8080
apiVersion: v1
kind: Service
metadata:
  name: aigw-local-hiclaw-io
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: hiclaw-manager
    app.kubernetes.io/part-of: honeybadge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hiclaw-manager
  ports:
    - name: gateway
      port: 8080
      targetPort: 8080
---
# DNS alias: matrix-local.hiclaw.io → hiclaw-manager:6167
apiVersion: v1
kind: Service
metadata:
  name: matrix-local-hiclaw-io
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: hiclaw-manager
    app.kubernetes.io/part-of: honeybadge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hiclaw-manager
  ports:
    - name: matrix
      port: 6167
      targetPort: 6167
---
# External access: Matrix (Tuwunel) on NodePort 30167
# Browser connects to ws://ECS_IP:30167 via matrix-js-sdk
apiVersion: v1
kind: Service
metadata:
  name: hiclaw-matrix-nodeport
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: hiclaw-manager
    app.kubernetes.io/part-of: honeybadge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hiclaw-manager
  ports:
    - name: matrix
      port: 6167
      targetPort: 6167
      nodePort: 30167
---
# External access: Element Web on NodePort 30888
apiVersion: v1
kind: Service
metadata:
  name: hiclaw-element-nodeport
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: hiclaw-manager
    app.kubernetes.io/part-of: honeybadge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hiclaw-manager
  ports:
    - name: element
      port: 18888
      targetPort: 18888
      nodePort: 30888
