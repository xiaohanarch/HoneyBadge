# =============================================================================
# MCP Servers — NebulaGraph, Audit, Cache
# =============================================================================

# --- honeybadge-nebula-mcp ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeybadge-nebula-mcp
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: honeybadge-nebula-mcp
    app.kubernetes.io/part-of: honeybadge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: honeybadge-nebula-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honeybadge-nebula-mcp
        app.kubernetes.io/part-of: honeybadge
    spec:
      containers:
        - name: nebula-mcp
          image: honeybadge-nebula-mcp:latest
          ports:
            - containerPort: 8000
          env:
            - name: NEBULA_HOST
              value: "nebula-graphd"
            - name: NEBULA_PORT
              value: "9669"
            - name: NEBULA_USER
              value: "root"
            - name: NEBULA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: NEBULA_PASSWORD
            - name: NEBULA_SPACE
              value: "honeybadge"
            - name: LLM_ENDPOINT
              value: "http://hiclaw-manager:8080"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: LLM_API_KEY
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: LLM_MODEL
            - name: PERMISSION_SERVICE_URL
              value: "http://honeybadge-permissions:8092"
            - name: TZ
              value: "Asia/Shanghai"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: honeybadge-nebula-mcp
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: honeybadge-nebula-mcp
    app.kubernetes.io/part-of: honeybadge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: honeybadge-nebula-mcp
  ports:
    - port: 8000
      targetPort: 8000
---
# --- honeybadge-audit-mcp ---
apiVersion: apps/v1
