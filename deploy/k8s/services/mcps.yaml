            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: PG_PASSWORD
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: PG_DATABASE
            - name: TZ
              value: "Asia/Shanghai"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: honeybadge-audit-mcp
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: honeybadge-audit-mcp
    app.kubernetes.io/part-of: honeybadge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: honeybadge-audit-mcp
  ports:
    - port: 8000
      targetPort: 8000
---
