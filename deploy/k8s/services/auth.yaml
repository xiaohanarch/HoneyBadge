apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeybadge-auth
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: honeybadge-auth
    app.kubernetes.io/part-of: honeybadge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: honeybadge-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honeybadge-auth
        app.kubernetes.io/part-of: honeybadge
    spec:
      containers:
        - name: auth
          image: honeybadge-auth:latest
          ports:
            - containerPort: 8091
          env:
            - name: TUWUNEL_URL
              value: "http://hiclaw-manager:6167"
            - name: MATRIX_DOMAIN
              value: "matrix-local.hiclaw.io"
            - name: HICLAW_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: HICLAW_REGISTRATION_TOKEN
            - name: MATRIX_USER_SECRET
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: MATRIX_USER_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: JWT_SECRET
            - name: MATRIX_HOMESERVER_PUBLIC
              value: "http://hiclaw-manager:6167"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_ENABLED
              value: "false"
            - name: AUTH_SERVICE_URL
              value: "http://honeybadge-auth:8091"
            - name: DEFAULT_ROLE
              value: "analyst"
            - name: TZ
              value: "Asia/Shanghai"
          readinessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: honeybadge-auth
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: honeybadge-auth
    app.kubernetes.io/part-of: honeybadge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: honeybadge-auth
  ports:
    - port: 8091
      targetPort: 8091
