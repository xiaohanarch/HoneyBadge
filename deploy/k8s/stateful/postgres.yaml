apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: honeybadge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: honeybadge
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: honeybadge
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: PG_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: PG_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: PG_DATABASE
            - name: TZ
              value: "Asia/Shanghai"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "honeybadge", "-d", "honeybadge_audit"]
            periodSeconds: 10
            initialDelaySeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "honeybadge", "-d", "honeybadge_audit"]
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: init.sql
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
