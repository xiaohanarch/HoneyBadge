# HoneyBadge Secrets — SCHEMA REFERENCE ONLY (do not apply directly)
#
# WARNING: This file documents the secret KEYS consumed by the k8s
# manifests. It is intentionally excluded from kustomization.yaml.
# Real values are NEVER stored in git.
#
# Production path:  deploy/k8s/scripts/01-apply-secrets.sh
#   - reads values from environment variables (or generates strong random
#     defaults) and creates the honeybadge-secrets Secret on the cluster
#   - run on the ECS, not from CI
#
# Values below are placeholders on purpose. This file previously carried
# real-looking dev credentials; since the repository is public they must
# be treated as leaked — see UPGRADE-NOTES item 24 for the rotation
# runbook (ECS values must be rotated with dependency ordering).
apiVersion: v1
kind: Secret
metadata:
  name: honeybadge-secrets
  namespace: honeybadge
  labels:
    app.kubernetes.io/part-of: honeybadge
type: Opaque
stringData:
  # LLM provider (set via env when running 01-apply-secrets.sh)
  LLM_API_KEY: "REPLACE-ME"
  LLM_ENDPOINT: "REPLACE-ME"
  LLM_MODEL: "REPLACE-ME"
  # Auth — JWT signing secret (server + auth-service + nebula-mcp)
  JWT_SECRET: "REPLACE-ME"
  # NebulaGraph
  NEBULA_PASSWORD: "REPLACE-ME"
  # Redis
  REDIS_PASSWORD: "REPLACE-ME"
  # PostgreSQL
  PG_USER: "REPLACE-ME"
  PG_PASSWORD: "REPLACE-ME"
  PG_DATABASE: "REPLACE-ME"
  # AgentTeams manager (ADMIN_PASSWORD doubles as the MinIO root secret)
  HICLAW_ADMIN_USER: "REPLACE-ME"
  HICLAW_ADMIN_PASSWORD: "REPLACE-ME"
  HICLAW_REGISTRATION_TOKEN: "REPLACE-ME"
  # Referenced by manager.yaml but historically missing here — set these
  # or the manager reverts to image defaults:
  HICLAW_MANAGER_PASSWORD: "REPLACE-ME"
  HICLAW_MANAGER_GATEWAY_KEY: "REPLACE-ME"
  # Auth-ticket identity chain (server <-> MCP shared secret)
  HONEYBADGE_SERVICE_TOKEN: "REPLACE-ME"
  # Matrix (HMAC derivation of per-user Matrix passwords)
  MATRIX_USER_SECRET: "REPLACE-ME"
  # Google SSO (disabled by default)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
