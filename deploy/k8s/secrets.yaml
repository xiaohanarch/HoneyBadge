# HoneyBadge Secrets — DEV ONLY
# WARNING: In production, use Sealed Secrets or External Secrets Operator.
# Never commit real credentials to git.
apiVersion: v1
kind: Secret
metadata:
  name: honeybadge-secrets
  namespace: honeybadge
  labels:
    app.kubernetes.io/part-of: honeybadge
type: Opaque
stringData:
  # LLM Provider
  LLM_API_KEY: "changeme"
  LLM_ENDPOINT: "https://api.minimaxi.com"
  LLM_MODEL: "MiniMax-M2.7"
  # Auth
  JWT_SECRET: "honeybadge-dev-secret-change-in-prod"
  # NebulaGraph
  NEBULA_PASSWORD: "nebula"
  # Redis
  REDIS_PASSWORD: "redis123"
  # PostgreSQL
  PG_USER: "honeybadge"
  PG_PASSWORD: "honeybadge123"
  PG_DATABASE: "honeybadge_audit"
  # HiClaw
  HICLAW_ADMIN_USER: "admin"
  HICLAW_ADMIN_PASSWORD: "admin1234"
  HICLAW_REGISTRATION_TOKEN: "honeybadge-reg-token"
  # Matrix
  MATRIX_USER_SECRET: "hb-user-secret-dev"
  # Google SSO (disabled by default)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
