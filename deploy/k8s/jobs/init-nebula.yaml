# Initialize NebulaGraph schema
# Prerequisite: create nebula-schema ConfigMap first:
#   kubectl create configmap nebula-schema \
#     --from-file=nebula-schema.ngql=deploy/docker/nebula-schema.ngql \
#     --from-file=nebula-edges.ngql=deploy/docker/nebula-edges.ngql \
#     -n honeybadge
# Or use Kustomize configMapGenerator (see kustomization.yaml)
apiVersion: batch/v1
kind: Job
metadata:
  name: init-nebula
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: init-nebula
    app.kubernetes.io/part-of: honeybadge
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-graphd
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until wget -q --spider http://nebula-graphd:19669/status; do echo "Waiting for graphd..."; sleep 5; done'
      containers:
        - name: init-nebula
          image: vesoft/nebula-console:v3.8.0
          command:
            - sh
            - -c
            - |
              set -e
              CONSOLE="nebula-console -addr nebula-graphd -port 9669 -user root -password nebula"

              echo "=== Adding storaged host ==="
              echo "ADD HOSTS nebula-storaged-0.nebula-storaged.honeybadge.svc.cluster.local:9779;" | $CONSOLE
              sleep 5

              echo "=== Creating space ==="
              echo "CREATE SPACE IF NOT EXISTS honeybadge (partition_num=50, replica_factor=1, vid_type=FIXED_STRING(64));" | $CONSOLE
              sleep 10

              echo "=== Applying tag schema ==="
              $CONSOLE -f /schema/nebula-schema.ngql || true

              echo "=== Applying edge schema ==="
              $CONSOLE -f /schema/nebula-edges.ngql || true

              echo "=== Rebuilding indexes ==="
              echo "USE honeybadge; REBUILD TAG INDEX; REBUILD EDGE INDEX;" | $CONSOLE

              echo "=== NebulaGraph schema initialized ==="
          volumeMounts:
            - name: schema-files
              mountPath: /schema
      volumes:
        - name: schema-files
          configMap:
            name: nebula-schema
