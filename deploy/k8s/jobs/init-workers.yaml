# Verify HiClaw worker initialization
# Manager auto-inits via entrypoint-wrapper.sh → manager-init-internal.sh
# This job verifies configs exist in MinIO
apiVersion: batch/v1
kind: Job
metadata:
  name: init-workers
  namespace: honeybadge
  labels:
    app.kubernetes.io/name: init-workers
    app.kubernetes.io/part-of: honeybadge
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        # v1.1.0 split topology: MinIO lives on hiclaw-embedded (was hiclaw-manager).
        - name: wait-for-embedded
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until wget -q --spider http://hiclaw-embedded:9000/minio/health/live; do echo "Waiting for embedded MinIO..."; sleep 10; done'
      containers:
        - name: verify
          image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/hiclaw-manager:v1.1.2
          command:
            - sh
            - -c
            - |
              set -e
              echo "Verifying MinIO worker configs..."
              mc alias set hiclaw http://hiclaw-embedded:9000 ${HICLAW_ADMIN_USER} ${HICLAW_ADMIN_PASSWORD}

              # Bucket must exist (manager-init-internal.sh creates it idempotently,
              # but verify here in case the manager Pod hasn't completed Step 1 yet).
              if ! mc ls hiclaw/hiclaw-storage >/dev/null 2>&1; then
                echo "ERROR: hiclaw-storage bucket not found in embedded MinIO"
                echo "  hint: manager-init-internal.sh should create it via 'mc mb --ignore-existing'"
                exit 1
              fi

              # Verify each expected agent has its canonical configs uploaded.
              # manager: openclaw.json + SOUL.md + AGENTS.md + workers-registry.json
              # workers: openclaw.json + SOUL.md + AGENTS.md
              missing=0
              for path in \
                  agents/manager/openclaw.json \
                  agents/manager/SOUL.md \
                  agents/manager/AGENTS.md \
                  agents/graph-worker/openclaw.json \
                  agents/graph-worker/SOUL.md \
                  agents/graph-worker/AGENTS.md \
                  agents/analytics-worker/openclaw.json \
                  agents/analytics-worker/SOUL.md \
                  agents/analytics-worker/AGENTS.md ; do
                if mc stat "hiclaw/hiclaw-storage/${path}" >/dev/null 2>&1; then
                  echo "  ok: ${path}"
                else
                  echo "  MISSING: ${path}"
                  missing=$((missing + 1))
                fi
              done

              if [ "$missing" -gt 0 ]; then
                echo "ERROR: ${missing} agent config(s) missing in MinIO"
                echo "  hint: check hiclaw-manager Pod logs — manager-init-internal.sh"
                echo "        should populate these on every startup"
                exit 1
              fi
              echo "Worker initialization verified successfully"
          env:
            - name: HICLAW_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: HICLAW_ADMIN_USER
            - name: HICLAW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: honeybadge-secrets
                  key: HICLAW_ADMIN_PASSWORD
