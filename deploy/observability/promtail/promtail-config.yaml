server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml
  ignore_invalid_yaml: true

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: honeybadge
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: honeybadge
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.honeybadge.service"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_honeybadge_service']
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_honeybadge_version']
        target_label: version
      - action: labelmap
        regex: __meta_docker_container_label_(.+)
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            trace_id: trace_id
            user_id: user_id
            session_id: session_id
            message: message
            service: service
            duration_ms: duration_ms
            result_rows: result_rows
            extra: extra
      - labels:
          level:
          trace_id:
          service:
          version:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message

  - job_name: higress
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["io.caddy.service"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            method: method
            path: path
            status: status
      - labels:
          level:
          method:
          path:
          status:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          host: hostname
          __path__: /var/log/**/*.log
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2})\s+(?P<level>\w+)\s+(?P<message>.*)$'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
