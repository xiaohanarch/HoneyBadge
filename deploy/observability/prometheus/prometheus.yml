global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # HiClaw Manager
  - job_name: 'hiclaw-manager'
    static_configs:
      - targets: ['hiclaw-manager:8080']
    metrics_path: /metrics

  # HiClaw Workers (graph group)
  - job_name: 'hiclaw-workers-graph'
    static_configs:
      - targets: ['hiclaw-graph-worker:8080']
    metrics_path: /metrics

  # HiClaw Workers (analytics group)
  - job_name: 'hiclaw-workers-analytics'
    static_configs:
      - targets: ['hiclaw-analytics-worker:8080']
    metrics_path: /metrics

  # NebulaGraph
  - job_name: 'nebula'
    static_configs:
      - targets: ['nebula-graphd:19669', 'nebula-storaged:19779']
    metrics_path: /metrics

  # NebulaGraph Exporter
  # (commented out — no nebula-exporter container in docker-compose)
  # - job_name: 'nebula-exporter'
  #   static_configs:
  #     - targets: ['nebula-exporter:9220']
  #   metrics_path: /metrics

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3030']
    metrics_path: /metrics

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: /metrics
