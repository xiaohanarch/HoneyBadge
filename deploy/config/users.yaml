# ===========================================================================
# HoneyBadge Demo User Store
#
# DEVELOPMENT / TESTING ONLY. In production, replace with a real user store
# (LDAP, Active Directory, or a hashed-credential database table). Plaintext
# passwords below are hashed with bcrypt at load time by server/auth.py.
#
# Loaded by src/honeybadge/server/auth.py when HONEYBADGE_USERS_CONFIG points
# to this file. If the env var is unset or the file is absent, the loader
# falls back to the built-in DEMO_USERS defaults compiled into auth.py.
#
# Default dev credentials (DO NOT use in production):
#   admin             / admin123    (系统管理员,   roles=[admin],    org_id=1000)
