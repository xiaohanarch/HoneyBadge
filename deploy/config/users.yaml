#   auditor           / auditor123  (审计员,       roles=[auditor],  org_id=1000)
#   procurement_lead  / lead123     (采购部门领导, roles=[analyst],  org_id=1000)
#   subsidiary_lead   / lead123     (子公司领导,   roles=[analyst],  org_id=1021)
# ===========================================================================

