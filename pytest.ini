[pytest]
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    e2e: end-to-end tests
    auth: authentication tests
    chat: chat functionality tests
    session: session management tests
    isolation: user isolation tests
    permission: permission tests
    antihal: anti-hallucination framework tests
    mcp: MCP service tests
    infra: infrastructure tests
    observability: observability stack tests
    slow: slow running tests
    eval_ci: eval suite CI-layer tests (deterministic, no LLM calls)

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout
# Method must be `thread` (not the default `signal`) so per-test timeouts
# can still fire when a test is blocked in a syscall like os.waitpid()
# inside asyncio's child watcher — which happens with playwright browser
# subprocesses. With signal-based timeouts, SIGALRM cannot interrupt the
# blocked thread and pytest hangs forever (see run 25890748138, tc110).
timeout = 300
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
