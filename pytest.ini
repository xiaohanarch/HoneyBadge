[pytest]
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    e2e: end-to-end tests
    auth: authentication tests
    chat: chat functionality tests
    session: session management tests
    isolation: user isolation tests
    permission: permission tests
    antihal: anti-hallucination framework tests
    mcp: MCP service tests
    infra: infrastructure tests
    observability: observability stack tests
    slow: slow running tests

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout
timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
