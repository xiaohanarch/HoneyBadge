name: Diagnose ECS deployment state

# One-shot diagnostic to verify what's actually deployed on the ECS k3s
# cluster. Use to confirm whether a recent fix (e.g. TC-102 HICLAW_MATRIX_URL)
# has been rolled into pods, or whether the cluster is running stale images
# while master already has the fix.
#
# Run via: gh workflow run "Diagnose ECS deployment state"
# Pure read-only (kubectl get/describe/exec grep).

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Snapshot ECS k3s pod versions and config state
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: SSH to ECS and gather diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 8m
          script: |
            set +e  # don't bail on individual kubectl misses
            NS=honeybadge

            echo "=========================================="
            echo "1. Pod inventory ($NS namespace)"
            echo "=========================================="
            kubectl -n $NS get pods -o wide

            echo ""
            echo "=========================================="
            echo "2. Container images per pod"
            echo "=========================================="
            kubectl -n $NS get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[*].image}{"\n"}{end}'

            echo ""
            echo "=========================================="
            echo "3. Deployment image + last rollout"
            echo "=========================================="
            # NOTE: hiclaw-embedded is the actual deploy name (not honeybadge-hiclaw-embedded).
            for dep in hiclaw-manager hiclaw-graph-worker hiclaw-analytics-worker hiclaw-embedded honeybadge-server honeybadge-auth honeybadge-nebula-mcp honeybadge-audit-mcp honeybadge-cache-mcp; do
              echo ""
              echo "--- $dep ---"
              kubectl -n $NS get deploy "$dep" -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || echo "(not found)"
              kubectl -n $NS rollout history deploy "$dep" 2>/dev/null | tail -5 || true
              kubectl -n $NS get deploy "$dep" -o jsonpath='Last update: {.status.conditions[?(@.type=="Progressing")].lastUpdateTime}{"\n"}' 2>/dev/null || true
            done

            echo ""
            echo "=========================================="
            echo "3b. PVC inventory + age (detect hiclaw-embedded data reset)"
            echo "=========================================="
            kubectl -n $NS get pvc -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,CAPACITY:.status.capacity.storage,CREATED:.metadata.creationTimestamp,AGE:.metadata.creationTimestamp 2>/dev/null

            echo ""
            echo "=========================================="
            echo "4. ConfigMap names + latest annotation timestamps"
            echo "=========================================="
            kubectl -n $NS get configmap -o custom-columns=NAME:.metadata.name,CREATED:.metadata.creationTimestamp 2>/dev/null

            echo ""
            echo "=========================================="
            echo "5. Verify TC-102 fix: HICLAW_MATRIX_URL in Manager scripts"
            echo "=========================================="
            # The fix replaced hardcoded TUWUNEL_URL=127.0.0.1:6167 with
            # HICLAW_MATRIX_URL across 4 sites. If these grep results show
            # the env var, the configmap/image has the fix.
            # Kustomize uses app.kubernetes.io/name=hiclaw-manager (not app=hiclaw-manager).
            MGR_POD=$(kubectl -n $NS get pods -l app.kubernetes.io/name=hiclaw-manager -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -z "$MGR_POD" ]; then
              MGR_POD=$(kubectl -n $NS get pods --no-headers 2>/dev/null | awk '/^hiclaw-manager-/ {print $1; exit}')
            fi
            if [ -n "$MGR_POD" ]; then
              echo "Manager pod: $MGR_POD"
              echo ""
              echo "--- forward-to-user.sh ---"
              kubectl -n $NS exec "$MGR_POD" -- sh -c 'grep -nE "HICLAW_MATRIX_URL|TUWUNEL_URL.*6167" /usr/local/bin/forward-to-user.sh 2>/dev/null || find / -name forward-to-user.sh 2>/dev/null | head -3 | xargs -I{} grep -nHE "HICLAW_MATRIX_URL|TUWUNEL_URL.*6167" {} 2>/dev/null' 2>&1 | head -20
              echo ""
              echo "--- dispatch-to-worker.sh ---"
              kubectl -n $NS exec "$MGR_POD" -- sh -c 'find / -name dispatch-to-worker.sh 2>/dev/null | head -3 | xargs -I{} grep -nHE "HICLAW_MATRIX_URL|TUWUNEL_URL.*6167" {} 2>/dev/null' 2>&1 | head -20
              echo ""
              echo "--- fast-forward.sh ---"
              kubectl -n $NS exec "$MGR_POD" -- sh -c 'find / -name fast-forward.sh 2>/dev/null | head -3 | xargs -I{} grep -nHE "HICLAW_MATRIX_URL|TUWUNEL_URL.*6167" {} 2>/dev/null' 2>&1 | head -20
              echo ""
              echo "--- SKILL.md inline python ---"
              kubectl -n $NS exec "$MGR_POD" -- sh -c 'find / -path "*erp-query-dispatch/SKILL.md" 2>/dev/null | head -1 | xargs -I{} grep -nHE "HICLAW_MATRIX_URL|127\.0\.0\.1:6167" {} 2>/dev/null' 2>&1 | head -20
              echo ""
              echo "--- Manager env vars (HICLAW_* + MATRIX_*) ---"
              kubectl -n $NS exec "$MGR_POD" -- sh -c 'env | grep -E "HICLAW_|MATRIX_|TUWUNEL_" | sort' 2>&1 | head -20
            else
              echo "(no hiclaw-manager pod found)"
            fi

            echo ""
            echo "=========================================="
            echo "5b. Manager pod log tail (last 200 lines — look for dispatch decisions)"
            echo "=========================================="
            if [ -n "$MGR_POD" ]; then
              kubectl -n $NS logs "$MGR_POD" -c hiclaw-manager --tail=200 2>&1 | tail -200
            else
              echo "(no manager pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5c. hiclaw-embedded (Tuwunel/Matrix) pod log tail"
            echo "=========================================="
            EMB_POD=$(kubectl -n $NS get pods -l app.kubernetes.io/name=hiclaw-embedded -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -z "$EMB_POD" ]; then
              EMB_POD=$(kubectl -n $NS get pods --no-headers 2>/dev/null | awk '/^hiclaw-embedded-/ {print $1; exit}')
            fi
            if [ -n "$EMB_POD" ]; then
              echo "Embedded pod: $EMB_POD"
              kubectl -n $NS logs "$EMB_POD" --tail=100 2>&1 | tail -100
            else
              echo "(no hiclaw-embedded pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5d. honeybadge-auth pod log tail (Matrix account provisioning)"
            echo "=========================================="
            AUTH_POD=$(kubectl -n $NS get pods -l app=honeybadge-auth -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -z "$AUTH_POD" ]; then
              AUTH_POD=$(kubectl -n $NS get pods --no-headers 2>/dev/null | awk '/^honeybadge-auth-/ {print $1; exit}')
            fi
            if [ -n "$AUTH_POD" ]; then
              echo "Auth pod: $AUTH_POD"
              kubectl -n $NS logs "$AUTH_POD" --tail=100 2>&1 | tail -100
            else
              echo "(no auth pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5e. ConfigMap content sanity — fast-forward.sh key + size"
            echo "=========================================="
            kubectl -n $NS get configmap hiclaw-fast-query-skill -o jsonpath='{.data}' 2>/dev/null | tr ',' '\n' | grep -oE '"[a-zA-Z_.-]+\.sh"' | sort -u
            echo "Total keys in hiclaw-fast-query-skill:"
            kubectl -n $NS get configmap hiclaw-fast-query-skill -o jsonpath='{.data}' 2>/dev/null | grep -oE '\.sh' | wc -l

            echo ""
            echo "=========================================="
            echo "5f. honeybadge-init.log tail (entrypoint-wrapper.sh background init)"
            echo "=========================================="
            # entrypoint-wrapper.sh writes ALL init progress to a file inside
            # the Manager pod — kubectl logs only shows the native agent's
            # stdout, not Step 4 (allowlist patch). This is the ONLY way to
            # confirm whether manager-init-internal.sh actually ran.
            if [ -n "$MGR_POD" ]; then
              echo "--- /var/log/hiclaw/honeybadge-init.log (last 300 lines) ---"
              kubectl -n $NS exec "$MGR_POD" -- sh -c 'tail -300 /var/log/hiclaw/honeybadge-init.log 2>&1 || echo "(log file missing — wrapper never wrote it)"' 2>&1 | tail -300
            else
              echo "(no manager pod — cannot read init log)"
            fi

            echo ""
            echo "=========================================="
            echo "5g. Manager DM allowlist — LIVE value in /root/manager-workspace/openclaw.json"
            echo "=========================================="
            # Step 4 of manager-init-internal.sh is supposed to patch this
            # to include @hb-* users. If it shows only [@admin], the patch
            # never ran (or was overwritten by start-manager-agent.sh).
            if [ -n "$MGR_POD" ]; then
              kubectl -n $NS exec "$MGR_POD" -- sh -c 'python3 -c "
            import json
            try:
                with open(\"/root/manager-workspace/openclaw.json\") as f:
                    cfg = json.load(f)
                ch = cfg.get(\"channels\", {}).get(\"matrix\", {})
                print(\"dm.policy:\", ch.get(\"dm\", {}).get(\"policy\"))
                print(\"dm.allowFrom:\")
                for u in ch.get(\"dm\", {}).get(\"allowFrom\", []):
                    print(\"  -\", u)
                print(\"groupAllowFrom:\")
                for u in ch.get(\"groupAllowFrom\", []):
                    print(\"  -\", u)
            except Exception as e:
                print(\"ERROR:\", e)
            "' 2>&1 | head -40
            else
              echo "(no manager pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5h. MinIO copy of manager openclaw.json — does it match the live pod copy?"
            echo "=========================================="
            # If init Step 4 ran successfully, it also synced openclaw.json
            # to hiclaw/hiclaw-storage/agents/manager/openclaw.json. Compare
            # the MinIO copy's allowlist to detect a divergence (e.g. pod
            # was patched but native agent overwrote it after, or sync to
            # MinIO failed while local patch succeeded).
            if [ -n "$MGR_POD" ]; then
              kubectl -n $NS exec "$MGR_POD" -- sh -c '
                mc cp hiclaw/hiclaw-storage/agents/manager/openclaw.json /tmp/minio-manager-openclaw.json 2>&1 | tail -3
                python3 -c "
            import json
            try:
                with open(\"/tmp/minio-manager-openclaw.json\") as f:
                    cfg = json.load(f)
                ch = cfg.get(\"channels\", {}).get(\"matrix\", {})
                print(\"[MinIO] dm.policy:\", ch.get(\"dm\", {}).get(\"policy\"))
                print(\"[MinIO] dm.allowFrom:\")
                for u in ch.get(\"dm\", {}).get(\"allowFrom\", []):
                    print(\"  -\", u)
            except Exception as e:
                print(\"ERROR:\", e)
            "
              ' 2>&1 | head -40
            else
              echo "(no manager pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5i. Manager openclaw.json file mtime + parent process tree (overwrite detector)"
            echo "=========================================="
            # If file mtime is newer than the [init] Step 4 timestamp in 5f,
            # the native agent rewrote it AFTER the patch ran.
            if [ -n "$MGR_POD" ]; then
              kubectl -n $NS exec "$MGR_POD" -- sh -c '
                echo "--- file mtime ---"
                stat -c "%y %n" /root/manager-workspace/openclaw.json 2>/dev/null || ls -la /root/manager-workspace/openclaw.json 2>&1
                echo ""
                echo "--- container start time ---"
                stat -c "%y %n" /proc/1 2>/dev/null
                echo ""
                echo "--- entrypoint process tree (any background init still alive?) ---"
                ps -ef 2>&1 | grep -E "entrypoint-wrapper|manager-init|start-manager-agent" | grep -v grep
              ' 2>&1 | head -30
            else
              echo "(no manager pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5j. Worker pod logs (graph-worker + analytics-worker, last 200 lines)"
            echo "=========================================="
            # Manager-side allowlist is already verified (5g/5h). E2E failures show
            # the Manager dispatches tasks (erp-* IDs in 'helper' msg) but worker
            # results never come back. Capture worker stdout to see if LLM call hangs,
            # Matrix send fails, or skill never fires.
            for ROLE in graph-worker analytics-worker; do
              echo "--- hiclaw-$ROLE ---"
              W_POD=$(kubectl -n $NS get pod -l "app.kubernetes.io/name=hiclaw-$ROLE" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$W_POD" ]; then
                kubectl -n $NS logs "$W_POD" --tail=200 2>&1 | tail -200
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5k. Worker openclaw.json — LLM baseUrl + Matrix creds"
            echo "=========================================="
            # Workers reach Higress via aigw-local.hiclaw.io:8080 (NOT hiclaw-manager:8080).
            # baseUrl MUST end in /v1 or OpenAI SDK request shape is wrong.
            # matrix.homeserver must be reachable from worker pod; userId must match
            # a registered Matrix account.
            for ROLE in graph-worker analytics-worker; do
              echo "--- $ROLE openclaw.json ---"
              W_POD=$(kubectl -n $NS get pod -l "app.kubernetes.io/name=hiclaw-$ROLE" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$W_POD" ]; then
                # Use grep on the raw JSON instead of a python heredoc to avoid
                # YAML block-scalar indent issues that broke run 25924088402.
                # Field list mirrors the CLAUDE.md gotchas: baseUrl ends in /v1,
                # model+provider not overwritten by qwen default, matrix creds set.
                kubectl -n $NS exec "$W_POD" -- sh -c 'for F in /root/openclaw.json /root/worker-workspace/openclaw.json; do [ -f "$F" ] && echo "FOUND: $F" && grep -E "\"(baseUrl|model|provider|homeserver|userId|allowFrom)\"" "$F" | head -20; done' 2>&1 | head -40
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5l. Manager erp-* task state (last 30 min) — did Manager record dispatches?"
            echo "=========================================="
            # If E2E sent queries in the last 30 min, Manager should have written
            # erp-task state files. Empty result here means dispatch was never
            # recorded; populated means worker callback is the missing link.
            if [ -n "$MGR_POD" ]; then
              kubectl -n $NS exec "$MGR_POD" -- sh -c '
                echo "--- /root/manager-workspace tree (depth=2) ---"
                find /root/manager-workspace -maxdepth 2 2>/dev/null | head -40
                echo ""
                echo "--- erp-* artifacts modified in last 30 min ---"
                find /root/manager-workspace /root /tmp -maxdepth 4 -name "erp-*" -mmin -30 2>/dev/null | head -20
                echo ""
                echo "--- last 5 task files (any name) modified in last 30 min ---"
                find /root/manager-workspace -maxdepth 3 -type f -mmin -30 2>/dev/null | head -10
              ' 2>&1 | head -80
            else
              echo "(no manager pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5m. Worker process tree + Matrix homeserver connectivity"
            echo "=========================================="
            # Worker must (a) have a live openclaw process polling Matrix, and
            # (b) be able to TCP-reach the Tuwunel homeserver. If openclaw isn't
            # polling /sync, worker never sees the Manager dispatch DM.
            for ROLE in graph-worker analytics-worker; do
              echo "--- $ROLE ---"
              W_POD=$(kubectl -n $NS get pod -l "app.kubernetes.io/name=hiclaw-$ROLE" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$W_POD" ]; then
                kubectl -n $NS exec "$W_POD" -- sh -c '
                  echo "ps:"
                  ps -ef 2>&1 | grep -E "openclaw|claude|agent|start-" | grep -v grep | head -10
                  echo ""
                  echo "tcp -> matrix-local.hiclaw.io:6167:"
                  (timeout 3 bash -c "</dev/tcp/matrix-local.hiclaw.io/6167" && echo "  OK") 2>&1 | head -3
                  echo "tcp -> aigw-local.hiclaw.io:8080:"
                  (timeout 3 bash -c "</dev/tcp/aigw-local.hiclaw.io/8080" && echo "  OK") 2>&1 | head -3
                ' 2>&1 | head -25
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5n. Worker PID 1 cmdline + entrypoint scripts"
            echo "=========================================="
            # v4 5m showed worker pod ONLY has 'openclaw-gateway' as PID 1 —
            # no claude/agent process. Need to know what PID 1's real argv is
            # and what entrypoint scripts exist in the image, to find the
            # missing agent startup step.
            for ROLE in graph-worker analytics-worker; do
              echo "--- $ROLE ---"
              W_POD=$(kubectl -n $NS get pod -l "app.kubernetes.io/name=hiclaw-$ROLE" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$W_POD" ]; then
                kubectl -n $NS exec "$W_POD" -- sh -c '
                  echo "PID 1 cmdline:"
                  tr "\0" " " < /proc/1/cmdline 2>/dev/null; echo
                  echo ""
                  echo "PID 1 environ (HICLAW/MATRIX/AIGW/OPENCLAW only):"
                  tr "\0" "\n" < /proc/1/environ 2>/dev/null | grep -iE "HICLAW|MATRIX|AIGW|OPENCLAW|TUWUNEL|HOMESERVER" | sort
                  echo ""
                  echo "Entrypoint candidates:"
                  ls -la /entrypoint* /start-* /root/start-* /usr/local/bin/start-* /usr/local/bin/entrypoint* 2>/dev/null
                ' 2>&1 | head -50
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5o. Worker filesystem layout (find openclaw.json + workspace dirs)"
            echo "=========================================="
            # v4 5k failed grep on /root/openclaw.json and /root/worker-workspace/openclaw.json.
            # Find where openclaw.json actually lives.
            for ROLE in graph-worker analytics-worker; do
              echo "--- $ROLE ---"
              W_POD=$(kubectl -n $NS get pod -l "app.kubernetes.io/name=hiclaw-$ROLE" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$W_POD" ]; then
                kubectl -n $NS exec "$W_POD" -- sh -c '
                  echo "find openclaw.json (max 5 hits):"
                  find / -name "openclaw.json" -not -path "/proc/*" -not -path "/sys/*" 2>/dev/null | head -5
                  echo ""
                  echo "/root listing:"
                  ls -la /root/ 2>/dev/null
                  echo ""
                  echo "workspace dir candidates:"
                  ls -la /root/worker-workspace /root/.openclaw /workspace /opt/openclaw /opt/hiclaw 2>/dev/null
                ' 2>&1 | head -40
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5p. Worker — has agent ever started? (history / logs / lockfiles)"
            echo "=========================================="
            # If worker agent was ever supposed to start, we should find log files
            # or lock/pid files. Absence => entrypoint never invoked agent.
            for ROLE in graph-worker analytics-worker; do
              echo "--- $ROLE ---"
              W_POD=$(kubectl -n $NS get pod -l "app.kubernetes.io/name=hiclaw-$ROLE" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$W_POD" ]; then
                kubectl -n $NS exec "$W_POD" -- sh -c '
                  echo "all processes (ps or /proc fallback):"
                  ps -ef 2>/dev/null | head -20 || ls /proc/[0-9]*/comm 2>/dev/null | head -20
                  echo ""
                  echo "/tmp listing:"
                  ls -la /tmp/ 2>/dev/null | head -20
                  echo ""
                  echo "/var/log listing:"
                  ls -la /var/log/ 2>/dev/null | head -20
                  echo ""
                  echo "log/pid/lock files (top 20):"
                  find / -maxdepth 5 \( -name "*.log" -o -name "*.pid" -o -name "*.lock" \) -not -path "/proc/*" -not -path "/sys/*" 2>/dev/null | head -20
                ' 2>&1 | head -80
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5q. Worker Matrix session + credentials state"
            echo "=========================================="
            # If worker never logged into Matrix, it cannot /sync to see Manager DMs.
            for ROLE in graph-worker analytics-worker; do
              echo "--- $ROLE ---"
              W_POD=$(kubectl -n $NS get pod -l "app.kubernetes.io/name=hiclaw-$ROLE" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$W_POD" ]; then
                kubectl -n $NS exec "$W_POD" -- sh -c '
                  echo "matrix-related files:"
                  find / -maxdepth 6 \( -iname "*matrix*" -o -iname "*tuwunel*" -o -iname "*credential*" -o -iname "*session*" \) -not -path "/proc/*" -not -path "/sys/*" -not -path "*/node_modules/*" 2>/dev/null | head -15
                  echo ""
                  echo "env (Matrix/homeserver related):"
                  env 2>/dev/null | grep -iE "MATRIX|TUWUNEL|HOMESERVER|HICLAW_MATRIX" | sort
                ' 2>&1 | head -30
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5r. Worker Deployment manifest — command/args/env from k8s"
            echo "=========================================="
            # Compare with Manager Deployment. If Manager has a start-manager-agent.sh
            # in command/args but workers don't, that's the missing piece.
            for DEP in hiclaw-graph-worker hiclaw-analytics-worker hiclaw-manager; do
              echo "--- $DEP command/args/env ---"
              kubectl -n $NS get deploy "$DEP" -o jsonpath='{range .spec.template.spec.containers[*]}name={.name}{"\n"}command={.command}{"\n"}args={.args}{"\n"}{end}' 2>&1
              echo ""
              echo "--- $DEP env names ---"
              kubectl -n $NS get deploy "$DEP" -o jsonpath='{range .spec.template.spec.containers[*].env[*]}{.name}{"\n"}{end}' 2>&1 | sort | head -30
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5s. Worker openclaw.json — live vs MinIO-synced source"
            echo "=========================================="
            # Active config: /root/.openclaw/openclaw.json (what openclaw-gateway actually reads)
            # MinIO-synced:  /root/hiclaw-fs/agents/<role>/openclaw.json (source of truth from embedded MinIO)
            # Need both to verify (a) sync happened (b) provider/baseUrl/model are correct
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) ---"
              if [ -n "$POD" ]; then
                echo "[active] /root/.openclaw/openclaw.json size + key fields:"
                kubectl -n $NS exec "$POD" -- sh -c 'ls -la /root/.openclaw/openclaw.json 2>&1; echo "---"; grep -E "\"(providers|matrix|homeserver|userId|baseUrl|model|primary|provider|domain)\"" /root/.openclaw/openclaw.json 2>&1 | head -40' 2>&1 | head -50
                echo ""
                echo "[source] /root/hiclaw-fs/agents/'"$ROLE"'/openclaw.json size + key fields:"
                kubectl -n $NS exec "$POD" -- sh -c "ls -la /root/hiclaw-fs/agents/$ROLE/openclaw.json 2>&1; echo '---'; grep -E '\"(providers|matrix|homeserver|userId|baseUrl|model|primary|provider|domain)\"' /root/hiclaw-fs/agents/$ROLE/openclaw.json 2>&1 | head -40" 2>&1 | head -50
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5t. openclaw-gateway daily log tail"
            echo "=========================================="
            # /tmp/openclaw/openclaw-YYYY-MM-DD.log is the gateway's own log file
            # (separate from container stdout, which is only the heartbeat).
            # This is where LLM calls, /sync errors, and Matrix delivery failures live.
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) — last 200 lines of latest /tmp/openclaw/*.log ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c 'ls -la /tmp/openclaw/ 2>&1; echo "---"; LATEST=$(ls -t /tmp/openclaw/openclaw-*.log 2>/dev/null | head -1); if [ -n "$LATEST" ]; then echo "[file=$LATEST]"; tail -200 "$LATEST"; else echo "(no openclaw-*.log files)"; fi' 2>&1 | head -250
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5u. Matrix sessions.json — keys + room/channel inventory"
            echo "=========================================="
            # Wake-up logic in worker-init-wrapper.sh depends on this file existing
            # with matrix:channel entries. Workers are ephemeral (no PVC), so on a
            # fresh pod this may be empty → workers appear online but ignore DMs.
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c 'find /root/.openclaw -name "sessions.json" -o -name "sessions" 2>/dev/null; echo "---"; for f in /root/.openclaw/agents/main/sessions/sessions.json /root/.openclaw/sessions.json; do if [ -f "$f" ]; then echo "[file=$f size=$(wc -c <$f)]"; echo "top-level keys:"; grep -oE "\"[a-zA-Z0-9_:-]+\":" "$f" 2>/dev/null | sort -u | head -40; echo "matrix:channel entries:"; grep -oE "\"matrix:[^\"]+\"" "$f" 2>/dev/null | sort -u | head -20; fi; done' 2>&1 | head -80
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5v. MinIO authoritative copy of worker openclaw.json"
            echo "=========================================="
            # Source of truth lives in MinIO bucket on the embedded pod.
            # If the live pod was patched but MinIO wasn't, the next pod restart
            # will pull stale config. If MinIO is patched but live is stale,
            # init-wrapper sync failed.
            EMB=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-embedded -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            echo "--- embedded pod: $EMB ---"
            if [ -n "$EMB" ]; then
              echo "MinIO bucket layout (agents/):"
              kubectl -n $NS exec "$EMB" -- sh -c 'mc ls --recursive local/hiclaw 2>&1 | grep -E "agents/(graph-worker|analytics-worker)/" | head -20' 2>&1 | head -25
              echo ""
              for ROLE in graph-worker analytics-worker; do
                echo "[minio] agents/$ROLE/openclaw.json key fields:"
                kubectl -n $NS exec "$EMB" -- sh -c "mc cat local/hiclaw/agents/$ROLE/openclaw.json 2>&1 | grep -E '\"(providers|matrix|homeserver|userId|baseUrl|model|primary|provider|domain)\"' | head -40" 2>&1 | head -45
                echo ""
              done
            else
              echo "(no embedded pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5w. Worker pod startup logs — init-wrapper + entrypoint output"
            echo "=========================================="
            # Container stdout from current + previous pods. Captures
            # worker-init-wrapper.sh prints, sync exit codes, wake-up nudge
            # attempts, and the openclaw-gateway boot banner.
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) — current pod logs (first 200 lines = init phase) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS logs "$POD" --tail=100000 2>&1 | head -200
                echo ""
                echo "--- $ROLE — current pod logs (last 80 lines = recent activity) ---"
                kubectl -n $NS logs "$POD" --tail=80 2>&1
                echo ""
                echo "--- $ROLE — previous pod logs init phase (if any) ---"
                kubectl -n $NS logs "$POD" --previous --tail=200 2>&1 | head -80 || echo "(no previous pod)"
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5x. Worker openclaw.json full content — agents/context/bootstrap blocks"
            echo "=========================================="
            # v6 5s grep only showed top-level keys. Need full context/bootstrap blocks
            # to test the hypothesis that analytics-worker is stuck in context-loading
            # due to a context/bootstrap config difference vs graph-worker.
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) — full openclaw.json (with API key redacted) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c 'cat /root/.openclaw/openclaw.json 2>&1 | sed -E "s/(\"[A-Za-z_]*[Tt]oken\"|\"[A-Za-z_]*[Ss]ecret\"|\"apiKey\"|\"password\"|\"matrixToken\"|\"accessToken\"|\"registrationToken\")\s*:\s*\"[^\"]+\"/\1: \"<REDACTED>\"/g"' 2>&1 | head -400
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5y. Worker SOUL.md + AGENTS.md sizes + first 40 lines"
            echo "=========================================="
            # Large SOUL.md or AGENTS.md gets injected into bootstrap context.
            # If analytics-worker has bloated prompt files, that explains
            # bootstrapTruncation + nearLimitFiles seen in v6 5u sessions.json.
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c "echo '[SOUL.md]'; ls -la /root/hiclaw-fs/agents/$ROLE/SOUL.md 2>&1; wc -l /root/hiclaw-fs/agents/$ROLE/SOUL.md 2>&1; echo '--- head:'; head -40 /root/hiclaw-fs/agents/$ROLE/SOUL.md 2>&1; echo ''; echo '[AGENTS.md]'; ls -la /root/hiclaw-fs/agents/$ROLE/AGENTS.md 2>&1; wc -l /root/hiclaw-fs/agents/$ROLE/AGENTS.md 2>&1; echo '--- head:'; head -40 /root/hiclaw-fs/agents/$ROLE/AGENTS.md 2>&1" 2>&1 | head -100
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5z. analytics-worker sessions.json FULL dump (17 KB, with secrets redacted)"
            echo "=========================================="
            # v6 5u showed only top-level key names. To see where the session
            # actually got stuck (bootstrap?  skill resolution?  LLM call?) we
            # need the full structure. Limited to analytics-worker because
            # graph-worker is known-working.
            POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-analytics-worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            echo "--- analytics-worker ($POD) ---"
            if [ -n "$POD" ]; then
              kubectl -n $NS exec "$POD" -- sh -c 'cat /root/.openclaw/agents/main/sessions/sessions.json 2>&1 | sed -E "s/(\"[A-Za-z_]*[Tt]oken\"|\"[A-Za-z_]*[Ss]ecret\"|\"apiKey\"|\"password\"|\"matrixToken\"|\"accessToken\"|\"registrationToken\")\s*:\s*\"[^\"]+\"/\1: \"<REDACTED>\"/g"' 2>&1 | head -500
            else
              echo "(no analytics-worker pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5aa. mcporter.json location search — both workers + embedded pod"
            echo "=========================================="
            # v7 5z revealed analytics-worker is BLOCKED with
            #   "MCP config file missing at /root/hiclaw-fs/agents/analytics-worker/config/mcporter.json"
            # graph-worker is known-working, so its mcporter.json must live somewhere.
            # Find where (baked in image? mounted? MinIO-synced under a different key?).
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c 'echo "[find / -name mcporter.json]"; find / -name "mcporter.json" 2>/dev/null; echo ""; echo "[find / -name mcporter*]"; find / -name "mcporter*" 2>/dev/null | head -20; echo ""; echo "[which mcporter]"; which mcporter 2>&1; echo ""; echo "[mcporter --version]"; mcporter --version 2>&1 | head -5; echo ""; echo "[ls /root/hiclaw-fs/agents/$(hostname | sed s/hiclaw-//g | sed s/-[0-9a-f]*//g)/config/ 2>&1]"; ls -la /root/hiclaw-fs/agents/*/config/ 2>&1 | head -40; echo ""; echo "[env | grep -i mcp]"; env | grep -i mcp 2>&1' 2>&1 | head -80
              else
                echo "(no $ROLE pod)"
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5bb. MinIO bucket layout — what is synced to each worker"
            echo "=========================================="
            # If mcporter.json lives in MinIO under a specific role's config/ dir,
            # we'll see the asymmetry here.
            EMB=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-embedded -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            echo "--- hiclaw-embedded ($EMB) — MinIO data layout ---"
            if [ -n "$EMB" ]; then
              kubectl -n $NS exec "$EMB" -- sh -c 'find /data -type f \( -name "*.json" -o -name "*.md" \) 2>/dev/null | head -60; echo ""; echo "[All directories under /data]"; find /data -type d 2>/dev/null | head -60' 2>&1 | head -130
            else
              echo "(no embedded pod)"
            fi

            echo ""
            echo "=========================================="
            echo "5cc. MCP servers reachability + endpoints from worker"
            echo "=========================================="
            # Confirm MCP servers exist as Services and are reachable from worker
            # pod network. If mcporter is missing config, the worker won't even
            # try, but we want to confirm the infra is up so the fix is unblocking.
            kubectl -n $NS get svc 2>&1 | grep -i -E 'mcp|nebula|audit|cache' | head -20
            echo ""
            POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-graph-worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            echo "--- graph-worker DNS resolve mcp servers ---"
            if [ -n "$POD" ]; then
              kubectl -n $NS exec "$POD" -- sh -c 'for SVC in honeybadge-nebula-mcp honeybadge-audit-mcp honeybadge-cache-mcp; do echo "[$SVC]"; getent hosts $SVC 2>&1 || nslookup $SVC 2>&1 | head -5; done' 2>&1 | head -50
            fi

            echo ""
            echo "=========================================="
            echo "5dd. LIVE openclaw daily log tail — last 150 lines per worker"
            echo "=========================================="
            # During an E2E run this captures real-time agent execution incl.
            # mcporter calls, LLM responses, and any tool-chain errors.
            TODAY=$(date -u +%Y-%m-%d)
            YESTERDAY=$(date -u -d 'yesterday' +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d 2>/dev/null)
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) — /tmp/openclaw/openclaw-*.log tail ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c "ls -la /tmp/openclaw/ 2>&1 | head -10; echo '---'; for F in /tmp/openclaw/openclaw-${TODAY}.log /tmp/openclaw/openclaw-${YESTERDAY}.log; do if [ -f \"\$F\" ]; then echo \"[tail -150 \$F]\"; tail -150 \"\$F\"; fi; done" 2>&1 | tail -200
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5ee. mcporter list-servers + list-tools per worker"
            echo "=========================================="
            # Confirm mcporter CAN reach the configured MCP servers from inside
            # each worker. If list-tools succeeds → MCP chain works at infra level
            # and any chat failures are LLM/permission/skill issues, not infra.
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c 'echo "[mcporter list-servers]"; mcporter list-servers 2>&1 | head -20; echo ""; echo "[mcporter list-tools honeybadge-nebula]"; timeout 15 mcporter list-tools honeybadge-nebula 2>&1 | head -30; echo ""; echo "[mcporter list-tools honeybadge-audit]"; timeout 15 mcporter list-tools honeybadge-audit 2>&1 | head -30' 2>&1 | head -100
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5ff. Most recent analytics-worker session activity (jq)"
            echo "=========================================="
            # Filter sessions.json for top 5 most recently updated sessions.
            # Uses jq (single-line, no embedded multi-line Python — avoids YAML
            # block scalar termination caused by col-0 heredoc content).
            POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-analytics-worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "$POD" ]; then
              kubectl -n $NS exec "$POD" -- sh -c 'F=/root/.openclaw/agents/main/sessions/sessions.json; if [ ! -f "$F" ]; then echo "(sessions.json not found at $F)"; exit 0; fi; if ! command -v jq >/dev/null 2>&1; then echo "(jq not installed; falling back to raw head)"; head -300 "$F"; exit 0; fi; echo "[top 5 sessions by lastActivity]"; jq -r "to_entries | map({key, la: (.value.lastActivity // 0), status: .value.status, cc: (.value.compactionCount // 0), skills: (.value.skillsSnapshot.resolvedSkills // [])}) | sort_by(-.la) | .[0:5] | .[] | \"---\nkey=\\(.key[0:120])\nlastActivity=\\(.la)\nstatus=\\(.status)\ncompactionCount=\\(.cc)\nresolvedSkills=\\(.skills)\"" "$F" 2>&1; echo ""; echo "[latest compaction summary, if any]"; jq -r "to_entries | sort_by(-(.value.lastActivity // 0)) | .[0].value.compactionCheckpoints // [] | if length > 0 then .[-1].summary[0:800] else \"(no compaction checkpoints)\" end" "$F" 2>&1' 2>&1 | head -200
            fi

            echo ""
            echo "=========================================="
            echo "5gg. Direct MCP server probe from graph-worker pod"
            echo "=========================================="
            # Bypass mcporter; hit MCP server SSE endpoint directly to confirm
            # network + server health.
            POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-graph-worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "$POD" ]; then
              kubectl -n $NS exec "$POD" -- sh -c 'for SVC in honeybadge-nebula-mcp honeybadge-audit-mcp honeybadge-cache-mcp; do echo "[curl -sI http://$SVC:8000/sse]"; timeout 5 curl -sI http://$SVC:8000/sse 2>&1 | head -8; echo ""; done' 2>&1 | head -50
            fi

            echo ""
            echo "=========================================="
            echo "5hh. Worker openclaw.json skills array + /root/skills/ inventory"
            echo "=========================================="
            # Determine if worker openclaw.json declares 'mcporter' in its skills
            # array AND whether /root/skills/mcporter/SKILL.md exists. Both are
            # required for openclaw runtime to resolve the skill at session boot.
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c '
                  echo "[openclaw.json paths]";
                  for P in /root/openclaw.json /root/hiclaw-fs/agents/'"$ROLE"'/openclaw.json /opt/openclaw/openclaw.json; do
                    if [ -f "$P" ]; then echo "  ok: $P ($(stat -c %s "$P") bytes)"; else echo "  missing: $P"; fi
                  done
                  echo ""
                  echo "[primary openclaw.json — skills array]";
                  CFG="";
                  for P in /root/openclaw.json /root/hiclaw-fs/agents/'"$ROLE"'/openclaw.json; do
                    if [ -f "$P" ] && [ -z "$CFG" ]; then CFG="$P"; fi
                  done
                  if [ -n "$CFG" ]; then
                    echo "  source: $CFG";
                    if command -v jq >/dev/null 2>&1; then
                      jq -r ".skills // (.agent.skills) // \"(no skills key)\"" "$CFG" 2>&1 | head -10;
                      echo "[full top-level keys]";
                      jq -r "keys[]" "$CFG" 2>&1 | head -20;
                    else
                      grep -E "\"skills\"|\"name\":" "$CFG" | head -10;
                    fi
                  fi
                  echo ""
                  echo "[/root/skills/ tree (depth 2)]";
                  if [ -d /root/skills ]; then
                    find /root/skills -maxdepth 2 -type f 2>&1 | head -30;
                    echo "";
                    echo "[SKILL.md presence per skill dir]";
                    for D in /root/skills/*/; do
                      NAME=$(basename "$D");
                      if [ -f "${D}SKILL.md" ]; then echo "  ok: $NAME"; else echo "  MISSING SKILL.md: $NAME"; fi
                    done
                  else
                    echo "  (/root/skills not present)";
                  fi
                ' 2>&1 | sed -E "s/(\"[A-Za-z_]*[Tt]oken\"|\"[A-Za-z_]*[Ss]ecret\"|\"apiKey\"|\"password\"|\"matrixToken\"|\"accessToken\"|\"registrationToken\")\s*:\s*\"[^\"]+\"/\1: \"<REDACTED>\"/g" | head -120
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5ii. Worker openclaw.json FULL content (redacted) — agents/tools/plugins"
            echo "=========================================="
            # v10 showed top-level keys are agents, channels, gateway, models,
            # plugins, session, tools — NO 'skills' key. v1.1.0 likely registers
            # MCP via tools or plugins. Dump those sections to know what to patch.
            POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-graph-worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "$POD" ]; then
              kubectl -n $NS exec "$POD" -- sh -c '
                CFG=/root/hiclaw-fs/agents/graph-worker/openclaw.json;
                if [ ! -f "$CFG" ]; then echo "(missing $CFG)"; exit 0; fi
                if ! command -v jq >/dev/null 2>&1; then echo "(no jq)"; head -200 "$CFG"; exit 0; fi
                echo "[agents section]"; jq -r ".agents" "$CFG" | head -40
                echo ""
                echo "[tools section]"; jq -r ".tools" "$CFG" | head -60
                echo ""
                echo "[plugins section]"; jq -r ".plugins" "$CFG" | head -60
                echo ""
                echo "[session section]"; jq -r ".session" "$CFG" | head -40
              ' 2>&1 | sed -E "s/(\"[A-Za-z_]*[Tt]oken\"|\"[A-Za-z_]*[Ss]ecret\"|\"apiKey\"|\"password\"|\"matrixToken\"|\"accessToken\"|\"registrationToken\")\s*:\s*\"[^\"]+\"/\1: \"<REDACTED>\"/g" | head -250
            fi

            echo ""
            echo "=========================================="
            echo "5jj. Worker /root/skills/ FULL recursive listing + look for SKILL.md anywhere"
            echo "=========================================="
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c '
                  echo "[ls -laR /root/skills (truncated)]";
                  ls -laR /root/skills 2>&1 | head -60
                  echo ""
                  echo "[locate SKILL.md anywhere readable]";
                  find / -name SKILL.md -type f 2>/dev/null | head -20
                  echo ""
                  echo "[/opt/openclaw + /opt/hiclaw skill scaffolding]";
                  for D in /opt/openclaw/skills /opt/hiclaw/skills /opt/hiclaw/agent/skills /usr/share/openclaw/skills; do
                    if [ -d "$D" ]; then echo "  found: $D"; ls -la "$D" | head -15; fi
                  done
                  echo ""
                  echo "[mcporter related binaries/files]";
                  which mcporter 2>&1; ls -la "$(which mcporter 2>/dev/null)" 2>&1 || true
                ' 2>&1 | head -150
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "5kk. Full /opt/openclaw/skills/ inventory + look for mcporter/file-sync"
            echo "=========================================="
            POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-graph-worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "$POD" ]; then
              kubectl -n $NS exec "$POD" -- sh -c '
                echo "[ls /opt/openclaw/skills (ALL entries)]";
                ls /opt/openclaw/skills 2>&1 | sort | column -c 120 || ls /opt/openclaw/skills | sort
                echo ""
                echo "[grep -F mcporter file-sync in skill dirs]";
                for D in /opt/openclaw/skills/*; do
                  if [ -d "$D" ]; then
                    n=$(basename "$D")
                    case "$n" in
                      *mcporter*|*mcp*|*file-sync*|*filesync*|*claw*|*honeybadge*)
                        echo "MATCH: $D"; ls -la "$D" | head -10 ;;
                    esac
                  fi
                done
                echo ""
                echo "[any /opt skill named mcporter or file-sync?]";
                find /opt -maxdepth 5 -type d \( -name mcporter -o -name file-sync \) 2>/dev/null | head -20
                echo ""
                echo "[sample SKILL.md from coding-agent for schema]";
                find /opt/openclaw/skills/coding-agent -maxdepth 3 -type f \( -name SKILL.md -o -name "*.yaml" -o -name "*.json" \) 2>/dev/null | head -10
              ' 2>&1 | head -120
            fi

            echo ""
            echo "=========================================="
            echo "5ll. MinIO contents — workers-registry.json + SOUL.md/AGENTS.md"
            echo "=========================================="
            POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-manager -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "$POD" ]; then
              kubectl -n $NS exec "$POD" -- sh -c '
                mc alias set local http://hiclaw-embedded:9000 "$HICLAW_ADMIN_USER" "$HICLAW_ADMIN_PASSWORD" 2>/dev/null >/dev/null
                echo "[mc ls hiclaw-storage]";
                mc ls --recursive local/hiclaw-storage 2>&1 | head -40
                echo ""
                echo "[workers-registry.json]";
                mc cat local/hiclaw-storage/config/workers-registry.json 2>&1 | head -80
                echo ""
                echo "[agents/graph-worker/SOUL.md head -40]";
                mc cat local/hiclaw-storage/agents/graph-worker/SOUL.md 2>&1 | head -40
                echo ""
                echo "[agents/graph-worker/AGENTS.md head -40]";
                mc cat local/hiclaw-storage/agents/graph-worker/AGENTS.md 2>&1 | head -40
              ' 2>&1 | sed -E "s/(\"[A-Za-z_]*[Tt]oken\"|\"[A-Za-z_]*[Ss]ecret\"|\"apiKey\"|\"password\"|\"matrixToken\"|\"accessToken\"|\"registrationToken\")\s*:\s*\"[^\"]+\"/\1: \"<REDACTED>\"/g" | head -250
            fi

            echo ""
            echo "=========================================="
            echo "5mm. openclaw log — search for skill/extension/plugin lines"
            echo "=========================================="
            for ROLE in graph-worker analytics-worker; do
              POD=$(kubectl -n $NS get pod -l app.kubernetes.io/name=hiclaw-$ROLE -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- $ROLE ($POD) ---"
              if [ -n "$POD" ]; then
                kubectl -n $NS exec "$POD" -- sh -c '
                  LOG=$(ls -1t /tmp/openclaw/openclaw-*.log 2>/dev/null | head -1)
                  if [ -z "$LOG" ]; then echo "(no openclaw log)"; exit 0; fi
                  echo "[log path: $LOG]"
                  grep -E "skill|extension|plugin|mcporter|file-sync|SOUL|AGENTS|resolved" "$LOG" 2>/dev/null | head -30
                  echo ""
                  echo "[grep ERROR/WARN last 20]"
                  grep -E "ERROR|WARN|error|warn" "$LOG" 2>/dev/null | tail -20
                ' 2>&1 | head -80
              fi
              echo ""
            done

            echo ""
            echo "=========================================="
            echo "6. Recent deployment events"
            echo "=========================================="
            kubectl -n $NS get events --sort-by='.lastTimestamp' 2>/dev/null | tail -20

            echo ""
            echo "=========================================="
            echo "7. Master HEAD on ECS host repo for reference"
            echo "=========================================="
            cd /root/HoneyBadge 2>/dev/null && git log --oneline -5 || echo "(no repo)"

            echo ""
            echo "=========================================="
            echo "Diagnostics complete"
            echo "=========================================="
            exit 0
