[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeybadge"
version = "1.0.0"
description = "Enterprise Knowledge Graph Intelligent Assistant for ERP systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "HoneyBadge Team"}
]
keywords = ["knowledge-graph", "erp", "nebula-graph", "hiclaw", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # NebulaGraph client
    "nebula3-python>=3.4.0",
    # Redis client
    "redis>=5.0.0",
    # PostgreSQL client
    "asyncpg>=0.29.0",
    # WebSocket
    "websockets>=12.0",
    # HTTP client
    "httpx>=0.27.0",
    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    # Template engine (for Jinja2 prompts)
    "jinja2>=3.1.0",
    # Logging and tracing
    "structlog>=24.0.0",
    # UUID generation
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
honeybadge = "honeybadge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
