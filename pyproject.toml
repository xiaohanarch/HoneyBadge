[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeybadge"
version = "1.0.0"
description = "Enterprise Knowledge Graph Intelligent Assistant for ERP systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "HoneyBadge Team"}
]
keywords = ["knowledge-graph", "erp", "nebula-graph", "hiclaw", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # NebulaGraph client
    "nebula3-python>=3.4.0",
    # Redis client
    "redis>=5.0.0",
    # PostgreSQL client
    "asyncpg>=0.29.0",
    # WebSocket
    "websockets>=12.0",
    # HTTP client
    "httpx>=0.27.0",
    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    # Template engine (for Jinja2 prompts)
    "jinja2>=3.1.0",
    # Logging and tracing
    "structlog>=24.0.0",
    # UUID generation
    "uuid6>=2024.1.12",
    # Prometheus metrics
    "prometheus-client>=0.19.0",
    # FastAPI server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # JWT auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    # Matrix client (HiClaw Manager-Worker communication)
    "matrix-nio>=0.21.0",
    # MCP SDK (Worker uses this to call MCP tools over SSE)
    "mcp>=1.0.0",
    # FastMCP framework (MCP servers use this)
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
honeybadge = "honeybadge.__main__:main"
honeybadge-server = "honeybadge.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
# B008: FastAPI Depends()/HTTPBearer() in default args is the intended pattern.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# app.py uses intentional lazy imports inside create_app() to avoid import-time
# side effects and circular-import footguns common in FastAPI app factories.
"src/honeybadge/server/app.py" = ["E402"]
# MCP test files manipulate sys.path before importing the server package.
"tests/test_audit_mcp.py" = ["E402"]
"tests/test_cache_mcp.py" = ["E402"]
"tests/test_nebula_mcp.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# matrix_client (matrix-js-sdk bridge) ships no py.typed marker.
module = ["honeybadge.gateway.matrix_client", "honeybadge.gateway.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
