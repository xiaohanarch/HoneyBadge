# ============================================================================
# HoneyBadge NebulaGraph Import Configuration (nebula-importer)
# Version: v3
# Description: Template for T+1 daily data import into NebulaGraph
# Usage: nebula-importer --config importer.yaml
# Environment Variables:
#   NEBULA_GRAPHD_HOST: NebulaGraph GraphD host (default: localhost)
#   NEBULA_GRAPHD_PORT: NebulaGraph GraphD port (default: 9669)
#   NEBULA_USER: NebulaGraph username (default: root)
#   NEBULA_PASSWORD: NebulaGraph password (default: nebula)
#   NEBULA_SPACE: Target space name (default: honeybadge)
#   BATCH_ID: ETL batch identifier (e.g., ETL-20260404-001)
# ============================================================================

version: v3
description: HoneyBadge T+1 Daily Import - Batch ${BATCH_ID}

clientSettings:
  retry: 3
  concurrency: 10
  channelBufferSize: 128
  space: ${NEBULA_SPACE:-honeybadge}
  connection:
    address: "${NEBULA_GRAPHD_HOST:-localhost}:${NEBULA_GRAPHD_PORT:-9669}"
    user: ${NEBULA_USER:-root}
    password: ${NEBULA_PASSWORD:-nebula}

logPath: ./logs/import-${BATCH_ID:-batch}.log
statsPath: ./stats/import-${BATCH_ID:-batch}.json

